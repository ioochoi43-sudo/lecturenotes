<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<title>강의 노트</title>
<meta name="apple-mobile-web-app-title" content="강의 노트">
<meta name="application-name" content="강의 노트">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192" type="image/png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20112%20101%27%3E%3Cpath%20fill%3D%27%23ff7933%27%20d%3D%27M11%202h18c4%200%206%201.3%207.6%203.4l1.8%202.3c1.5%201.9%203.4%202%206%202H101a10%2010%200%200%201%2010%2010v69a12%2012%200%200%201-12%2012H13A12%2012%200%200%201%201%2088.7V12A10%2010%200%200%201%2011%202z%27%2F%3E%3Crect%20x%3D%2711%27%20y%3D%2719%27%20width%3D%2790%27%20height%3D%2722%27%20rx%3D%274%27%20fill%3D%27%23ffffff%27%2F%3E%3Cpath%20fill%3D%27%23ffa87b%27%20d%3D%27M9%2028h90a8%208%200%200%201%208%208v52.7a12%2012%200%200%201-12%2012H13A12%2012%200%200%201%201%2088.7V36a8%208%200%200%201%208-8z%27%2F%3E%3C%2Fsvg%3E" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin="anonymous">
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<style>
/* ============================================================
   토큰
   ============================================================ */
:root{
  --bg:#FFFFFF;
  --surface:#F5F6F8;
  --surface-2:#EFF1F4;
  --line:#E9EBEF;
  --ink:#0E1116;
  --ink-2:#4A5058;
  --muted:#8C929B;
  --accent:#2F6BFF;
  --accent-soft:#EEF3FF;
  --danger:#E5484D;
  --ok:#12A594;

  --r-lg:20px;
  --r-md:14px;
  --r-sm:10px;

  --pad:20px;
  --tab-h:64px;

  --f-back:#2E5FCB; --f-mid:#4C86F5; --fsh:46,95,203;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg)}
body{
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  color:var(--ink);
  -webkit-text-size-adjust:100%;
  font-feature-settings:"ss01";
  overscroll-behavior-y:none;
}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
svg{width:20px;height:20px;flex:none}  /* 크기 규칙 누락 시 기본값 방지 */
input,textarea{font-size:16px} /* iOS 자동 확대 방지 */
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ============================================================
   레이아웃
   ============================================================ */
.app{
  max-width:1200px;margin:0 auto;
  padding:0 var(--pad);
  padding-bottom:calc(var(--tab-h) + 28px + env(safe-area-inset-bottom));
}
.topbar{
  position:sticky;top:0;z-index:20;
  background:rgba(255,255,255,.86);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  padding:calc(env(safe-area-inset-top) + 10px) 0 8px;
  border-bottom:1px solid transparent;
  transition:border-color .2s;
}
.topbar.stuck{border-bottom-color:var(--line)}
.topbar-in{max-width:1200px;margin:0 auto;padding:0 var(--pad);
  display:flex;align-items:center;gap:10px;min-height:40px}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--muted);margin:0 0 2px
}
h1{font-size:27px;font-weight:750;letter-spacing:-.02em;margin:0;line-height:1.2}
.h1-wrap{flex:1;min-width:0}
.h1-wrap h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  color:var(--ink);flex:none
}
.icon-btn:active{background:var(--surface)}
.icon-btn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}

.back{
  display:inline-flex;align-items:center;gap:3px;height:40px;padding:0 10px 0 4px;
  border-radius:12px;color:var(--accent);font-size:16px;font-weight:600;flex:none
}
.back:active{background:var(--accent-soft)}
.back svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}

/* 섹션 */
.sec{margin-top:26px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-head h2{font-size:17px;font-weight:700;letter-spacing:-.01em;margin:0}
.sec-head .aside{font-size:13px;font-weight:500;color:var(--muted)}
.link{color:var(--accent);font-size:14px;font-weight:600}

/* 검색 */
.search{
  display:flex;align-items:center;gap:9px;
  background:var(--surface);border-radius:12px;padding:0 12px;height:44px;margin-top:12px
}
.search svg{width:17px;height:17px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;border:0;background:none;outline:none;min-width:0}
.search input::placeholder{color:var(--muted)}
.search button{color:var(--muted);font-size:13px;font-weight:600;padding:6px}

/* ============================================================
   폴더 그리드
   ============================================================ */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:20px 14px}
@media(min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:22px 16px}}

.tile{display:block;width:100%;text-align:left;transition:transform .12s}
.tile:active{transform:scale(.955)}

.folder{margin-bottom:8px}
.fsvg{display:block;width:100%;height:auto;
  filter:drop-shadow(0 5px 10px rgba(var(--fsh),.3))}
.fsvg.add{filter:none}
.f-hi{stroke:#fff;stroke-opacity:.5;stroke-width:1;fill:none}
.f-sheet{fill:#fff}
.f-track{fill:#fff;opacity:.34}
.f-fill{fill:#fff;transition:width .35s ease}
.f-dash{fill:var(--accent-soft);stroke:#C6D3EA;stroke-width:1.8;stroke-dasharray:5 4}
.f-plus{stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;fill:none}
.tile .name{font-size:13.5px;font-weight:650;letter-spacing:-.01em;line-height:1.32;
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .meta{font-size:11.5px;color:var(--muted);margin-top:1px;display:block}

/* ============================================================
   리스트 (최근 노트 / 회차)
   ============================================================ */
.list{display:flex;flex-direction:column;gap:8px}
.row{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 13px;transition:background .12s
}
.row:active{background:var(--surface)}
.row .num{
  width:32px;height:32px;flex:none;border-radius:9px;background:var(--surface);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums
}
.row .num.done{background:var(--ok);color:#fff}
.row .num.doing{background:var(--accent-soft);color:var(--accent)}
.row .txt{flex:1;min-width:0}
.row .t1{font-size:15px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t2{font-size:12.5px;color:var(--muted);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{width:16px;height:16px;flex:none;stroke:#C4C9D0;fill:none;stroke-width:2.4;
  stroke-linecap:round;stroke-linejoin:round}
.row .mini{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink-2)}
.row .mini:active{background:var(--surface-2)}
.row .mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

/* 진행 요약 */
.progress-card{
  border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;margin-top:14px
}
.progress-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.progress-top b{font-size:22px;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.progress-top span{font-size:13px;color:var(--muted)}
.track{height:6px;border-radius:99px;background:var(--surface-2);margin-top:12px;overflow:hidden}
.track i{display:block;height:100%;background:var(--f-mid);border-radius:99px;transition:width .35s}

/* 회차 스트립 — 이 앱의 시그니처 */
.strip{display:flex;flex-wrap:wrap;gap:4px;margin-top:14px}
.strip button{
  height:22px;min-width:22px;padding:0 6px;border-radius:6px;background:var(--surface-2);
  font-size:10.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums
}
.strip button.doing{background:var(--accent-soft);color:var(--accent)}
.strip button.done{background:var(--ok);color:#fff}
.strip-legend{display:flex;gap:14px;margin-top:10px;font-size:11.5px;color:var(--muted)}
.strip-legend i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:5px;
  vertical-align:1px;background:var(--surface-2)}
.strip-legend .l2 i{background:var(--accent-soft)}
.strip-legend .l3 i{background:var(--ok)}

/* 버튼 */
.btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{
  height:42px;padding:0 15px;border-radius:12px;background:var(--surface);
  font-size:14.5px;font-weight:650;letter-spacing:-.01em;display:inline-flex;
  align-items:center;gap:7px;color:var(--ink)
}
.btn:active{background:var(--surface-2)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:active{background:#2559DB}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;color:var(--danger);border:1px solid #F6D8D9}
.btn.wide{width:100%;justify-content:center}

/* ============================================================
   노트 편집
   ============================================================ */
.seg{display:flex;gap:4px;background:var(--surface);padding:4px;border-radius:12px;margin-top:16px}
.seg button{
  flex:1;height:36px;border-radius:9px;font-size:13.5px;font-weight:650;color:var(--ink-2)
}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);
  box-shadow:0 1px 3px rgba(16,17,20,.1)}

.field{margin-top:22px}
.field-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.field label{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field .hint{font-size:11.5px;color:#B0B6BE}
.field textarea,.field input[type=text]{
  width:100%;border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 13px;background:#fff;outline:none;resize:none;
  line-height:1.62;letter-spacing:-.005em
}
.field textarea:focus,.field input[type=text]:focus{border-color:#B9CCFF;box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea::placeholder,.field input::placeholder{color:#BDC3CB}
.field.big textarea{min-height:260px}

.savebar{
  display:flex;align-items:center;gap:8px;margin-top:18px;
  font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums
}
.savebar .dot{width:7px;height:7px;border-radius:99px;background:var(--ok);flex:none}
.savebar .dot.pending{background:var(--accent);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.pager{display:flex;gap:8px;margin-top:26px}
.pager button{
  flex:1;border:1px solid var(--line);border-radius:var(--r-md);padding:12px;text-align:left;
  min-width:0
}
.pager button:disabled{opacity:.4}
.pager .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em}
.pager .v{font-size:13.5px;font-weight:600;margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pager .r{text-align:right}

/* ============================================================
   탭바
   ============================================================ */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  background:rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)
}
.tabbar-in{max-width:640px;margin:0 auto;display:flex;height:var(--tab-h)}
.tabbar button{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  color:var(--muted);font-size:10.5px;font-weight:600
}
.tabbar button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:var(--accent)}
.tabbar button[aria-current="page"] svg{fill:var(--accent-soft)}

/* ============================================================
   시트 / 모달 / 토스트
   ============================================================ */
.scrim{
  position:fixed;left:0;right:0;top:var(--vvt,0px);
  height:var(--vvh,100vh);
  z-index:40;background:rgba(14,17,22,.34);
  display:flex;align-items:flex-end;justify-content:center;
  -webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)
}
@supports (height:100dvh){ .scrim{ height:var(--vvh,100dvh) } }
.scrim.center{align-items:center;padding:20px}
.sheet{
  width:100%;max-width:520px;background:#fff;border-radius:22px 22px 0 0;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:calc(100% - 18px);overflow:auto;-webkit-overflow-scrolling:touch;
  animation:up .24s cubic-bezier(.2,.8,.2,1)
}
.scrim.center .sheet{border-radius:20px;padding:22px;animation:pop .18s ease-out;
  max-width:420px;max-height:100%}
/* 내용이 길어도 마지막 버튼은 항상 손 닿는 곳에 */
.sheet > .btn-row:last-child{
  position:sticky;bottom:0;background:#fff;z-index:1;
  margin-top:16px;padding-top:12px;padding-bottom:4px;
  box-shadow:0 -12px 16px -12px rgba(14,17,22,.18)
}
@keyframes up{from{transform:translateY(16px);opacity:.6}}
@keyframes pop{from{transform:scale(.96);opacity:0}}
.grip{width:38px;height:4px;border-radius:99px;background:var(--surface-2);margin:6px auto 14px}
.sheet h3{font-size:19px;font-weight:750;letter-spacing:-.02em;margin:0 0 6px}
.sheet p.desc{font-size:13.5px;color:var(--ink-2);line-height:1.55;margin:0 0 4px}
.sheet .field:first-of-type{margin-top:16px}

.menu{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.menu button{
  display:flex;align-items:center;gap:12px;padding:13px 10px;border-radius:12px;
  font-size:15.5px;font-weight:550;text-align:left
}
.menu button:active{background:var(--surface)}
.menu button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;color:var(--muted);flex:none}
.menu button.warn{color:var(--danger)}
.menu button.warn svg{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{
  height:36px;padding:0 14px;border-radius:99px;background:var(--surface);
  font-size:13.5px;font-weight:600;color:var(--ink-2)
}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff}
.swatches{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:11px;position:relative;flex:none;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.sw[aria-pressed="true"]::after{
  content:"";position:absolute;inset:-4px;border-radius:14px;border:2px solid var(--ink)
}
.sw.custom{display:grid;place-items:center;overflow:hidden;cursor:pointer}
.sw.custom::before{
  content:"";width:15px;height:15px;border-radius:99px;
  background:conic-gradient(#e5484d,#eda01a,#14a896,#4c86f5,#7a5af0,#e5484d);
  box-shadow:0 0 0 2px rgba(255,255,255,.9)
}
.sw.custom input{position:absolute;inset:0;opacity:0;width:100%;height:100%;
  border:0;padding:0;cursor:pointer}
.folder-pv{width:96px;margin-top:14px}
.preview{
  margin-top:10px;background:var(--surface);border-radius:12px;padding:11px 12px;
  font-size:12.5px;color:var(--ink-2);line-height:1.6;word-break:break-all
}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.toast{
  position:fixed;left:50%;bottom:calc(var(--tab-h) + 22px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:60;
  background:var(--ink);color:#fff;font-size:13.5px;font-weight:550;
  padding:11px 17px;border-radius:99px;box-shadow:0 8px 24px rgba(14,17,22,.24);
  animation:pop .16s ease-out;max-width:88vw;text-align:center
}

.banner{
  background:#FFF6E5;border:1px solid #FFE2AC;border-radius:var(--r-md);
  padding:12px 13px;margin-top:14px;font-size:12.5px;color:#7A5300;line-height:1.55
}

/* 빈 상태 */
.empty{text-align:center;padding:48px 20px}
.empty .ico{width:52px;height:52px;margin:0 auto 14px;border-radius:15px;background:var(--surface);
  display:grid;place-items:center}
.empty .ico svg{width:24px;height:24px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h3{font-size:16.5px;font-weight:700;margin:0 0 6px}
.empty p{font-size:13.5px;color:var(--muted);margin:0 auto;max-width:280px;line-height:1.6}
.empty .btn{margin-top:18px}

/* 설정 */
.set-group{margin-top:24px}
.set-group h2{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:0 0 9px}
.set-list{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.set-list button,.set-list div.item{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:14px 14px;border-bottom:1px solid var(--line);font-size:15px;font-weight:550
}
.set-list > :last-child{border-bottom:0}
.set-list button:active{background:var(--surface)}
.set-list svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;
  stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.set-list .warn svg{color:var(--danger)}
.set-list .val{margin-left:auto;font-size:13.5px;color:var(--muted);font-weight:500;
  font-variant-numeric:tabular-nums}
.set-list .warn{color:var(--danger)}

.tpl-tag{display:inline-flex;align-items:center;gap:6px;margin-top:12px;
  height:30px;padding:0 11px;border-radius:99px;background:var(--surface);
  font-size:12.5px;font-weight:600;color:var(--ink-2);max-width:100%}
.tpl-tag:active{background:var(--surface-2)}
.tpl-tag.on{background:var(--accent-soft);color:var(--accent)}
.tpl-tag svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round;flex:none}

/* 노트 6칸 그리드 */
.ncols{display:grid;gap:0 16px;align-items:start}
.ncols.n2{grid-template-columns:1fr 1fr}
.ncols.n3{grid-template-columns:1fr 1fr 1fr}
.ncol{min-width:0}
@media(max-width:480px){.ncols.n2,.ncols.n3{grid-template-columns:1fr}}

/* 레이아웃 편집 */
#layGrid .ncols{gap:0 14px}
.lay{position:relative;min-width:0;margin-bottom:26px}
.lay-t{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:7px;padding-right:56px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lay textarea{width:100%;border:1px solid var(--line);border-radius:var(--r-md);
  padding:12px 13px;background:#fff;resize:none;outline:none;line-height:1.62;
  pointer-events:none;display:block}
.lay-size{position:absolute;right:2px;top:-1px;font-size:10.5px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.rz{position:absolute;background:transparent;touch-action:none}
.rz::after{content:"";position:absolute;border-radius:99px;background:#CBD4E0}
.rz-y{left:6px;right:6px;bottom:-11px;height:22px;cursor:row-resize}
.rz-y::after{top:9px;left:50%;margin-left:-14px;height:4px;width:28px}
.rz:active::after{background:var(--accent)}

.chip-lab{font-size:11.5px;font-weight:700;color:var(--muted);align-self:center;margin-right:2px}
.chip-val{font-size:11.5px;color:var(--muted);align-self:center;margin-left:auto;
  font-variant-numeric:tabular-nums}

/* 노트 서식 도구 — 글 쓰는 칸을 누르면 아래에서 올라온다 */
.note-tools{
  position:fixed;left:0;right:0;z-index:35;
  bottom:calc(var(--tab-h) + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  transform:translateY(calc(100% + var(--tab-h) + 20px));
  transition:transform .2s cubic-bezier(.2,.8,.2,1);
  pointer-events:none
}
.note-tools.on{transform:translateY(0);pointer-events:auto}
.nt-inner{
  max-width:1200px;margin:0 auto;padding:9px var(--pad);
  display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
  -webkit-overflow-scrolling:touch
}
.nt-inner::-webkit-scrollbar{display:none}
.nt-inner .mdt{flex:none;height:36px;min-width:38px}
body.tools-open .app{padding-bottom:calc(var(--tab-h) + 86px + env(safe-area-inset-bottom))}
@media(min-width:700px){
  .note-tools{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom))}
}
@media print{.note-tools{display:none!important}}

/* 저장 경고 / 되돌리기 */
.save-alert{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(var(--tab-h) + 18px + env(safe-area-inset-bottom));
  z-index:70;width:min(560px, calc(100vw - 32px));
  background:#FFF6E5;border:1px solid #FFD98A;border-radius:14px;
  padding:13px 15px;font-size:13px;line-height:1.6;color:#6B4A00;
  box-shadow:0 10px 28px rgba(14,17,22,.18)
}
.save-alert b{display:block;margin-bottom:3px;font-size:13.5px;color:#523800}
.save-alert .btn{height:34px;margin-top:9px;margin-right:6px;font-size:13px}
.save-alert .btn.primary{background:#B86E00}
.savebar .dot.fail{background:var(--danger);animation:none}
.toast.undo{display:flex;align-items:center;gap:14px;padding-right:8px}
.toast.undo button{color:#8FC2FF;font-weight:700;font-size:13.5px;padding:6px 10px}

/* 이모지 표 */
.emt{border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.emt-head,.emt-row{display:grid;grid-template-columns:62px 1fr 108px;align-items:center;gap:8px}
.emt-head{padding:9px 12px;background:var(--surface);
  font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--muted);
  border-bottom:1px solid var(--line)}
.emt-row{padding:7px 12px;border-bottom:1px solid var(--line)}
.emt-row:last-child{border-bottom:0}
.emt input{border:1px solid transparent;border-radius:9px;padding:8px 9px;background:transparent;
  outline:none;width:100%;min-width:0}
.emt input:focus{border-color:#B9CCFF;background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.emt input::placeholder{color:#C3C8D0}
.emt-e{font-size:20px;text-align:center;line-height:1.1}
.emt-n{font-size:14px}
.emt-ctl{display:flex;align-items:center;justify-content:flex-end;gap:2px}
.emt-ctl .mini{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.emt-ctl .mini:active{background:var(--surface-2)}
.emt-ctl .mini svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.emt-pv{font-size:17px;opacity:.5;padding-right:6px}
.bu-row{grid-template-columns:68px 72px 1fr}
.bu-depth{font-size:12.5px;font-weight:650;color:var(--ink-2)}
.bu-sample{font-size:13px;color:var(--muted);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bu-sample b{color:var(--ink);font-weight:600}
@media(max-width:420px){.bu-row{grid-template-columns:54px 60px 1fr}}
@media(max-width:420px){
  .emt-head,.emt-row{grid-template-columns:52px 1fr 100px;gap:6px}
  .emt-row{padding:6px 9px}
}

/* 도구 막대 이모지 줄 */
.nt-inner.em{padding-bottom:0;border-bottom:1px solid var(--line);padding-top:7px}
.nt-inner.em + .nt-inner{padding-top:7px}
.emj{flex:none;height:34px;min-width:38px;border-radius:9px;background:var(--surface);
  font-size:18px;line-height:1;display:inline-flex;align-items:center;justify-content:center;
  margin-bottom:7px}
.emj:active{background:var(--surface-2)}
.emj.add{font-size:16px;color:var(--accent);background:var(--accent-soft)}

/* 제목 접기 */
.md-view details.fold{margin:0}
.md-view summary{
  list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:7px;
  border-radius:7px;margin-left:-4px;padding:1px 4px
}
.md-view summary::-webkit-details-marker{display:none}
.md-view summary::marker{content:""}
.md-view summary::before{
  content:"▾";font-size:.72em;color:var(--muted);flex:none;line-height:1.9;
  transition:transform .15s
}
.md-view details:not([open]) > summary::before{content:"▸"}
.md-view summary:active{background:var(--surface-2)}
.md-view summary > h1,.md-view summary > h2,
.md-view summary > h3,.md-view summary > h4{margin:0;flex:1;min-width:0}
/* 제목 아래 내용을 살짝 들여 세로선으로 묶는다 — 어디까지가 그 제목인지 보인다 */
.md-view .fold-body{padding-left:13px;margin-left:5px;border-left:1.5px solid var(--line)}
.md-view details.fold:not([open]) > .fold-body{border-left-color:transparent}
.md-view details.fold + details.fold{margin-top:2px}
.md-view details:not([open]) > summary{opacity:.72}
/* 접힌 제목 뒤에 생략 표시 */
.md-view details:not([open]) > summary::after{
  content:"⋯";color:var(--muted);font-size:.9em;flex:none
}

/* 노트 칸 미리보기 */
.fh-right{display:flex;align-items:center;gap:10px;min-width:0}
.fv-toggle{font-size:11.5px;font-weight:650;color:var(--accent);padding:2px 0;flex:none}
.fv-toggle.on{color:var(--muted)}
.md-view{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 13px;
  background:var(--surface);line-height:1.62;letter-spacing:-.005em;cursor:text;
  word-break:break-word;overflow-wrap:anywhere}
.md-view > :first-child{margin-top:0}
.md-view > :last-child{margin-bottom:0}
.md-view h1{font-size:19px;margin:0 0 7px;letter-spacing:-.02em}
.md-view h2{font-size:17px;margin:14px 0 5px;letter-spacing:-.01em}
.md-view h3{font-size:15px;margin:12px 0 4px}
.md-view h4{font-size:14px;margin:10px 0 3px}
.md-view p{margin:0 0 7px}
.md-view ol{margin:0 0 7px;padding-left:20px}
.md-view ol ol,.md-view ul ol,.md-view ol ul{margin:2px 0}
.md-view ul{margin:0 0 7px;padding-left:0;list-style:none}
/* 안쪽 목록은 한 단계만큼 밀어 넣는다 (이게 빠지면 단계가 안 보인다) */
.md-view ul ul{margin:2px 0;padding-left:1.45em}
.md-view ul > li{position:relative;padding-left:1.45em}
.md-view ul > li::before{
  content:var(--mk, var(--bu0,"-"));position:absolute;left:0;top:0;
  width:1.3em;color:var(--ink-2);font-variant-emoji:text
}
.md-view ul ul > li::before{content:var(--mk, var(--bu1,"+"))}
.md-view ul ul ul > li::before{content:var(--mk, var(--bu2,"*"))}
.md-view ul ul ul ul > li::before{content:var(--mk, var(--bu3,"-"))}
.md-view ul ul ul ul ul > li::before{content:var(--mk, var(--bu4,"+"))}
.md-view ul ul ul ul ul ul > li::before{content:var(--mk, var(--bu5,"*"))}
.md-view li > ul,.md-view li > ol,.md-view ul ul,.md-view ul ol,.md-view ol ol,.md-view ol ul{margin:2px 0 2px}
.md-view li{margin:2px 0}
.md-view hr{border:0;border-top:1px solid #D9DDE3;margin:12px 0}
.md-view blockquote{margin:7px 0;padding-left:12px;border-left:3px solid #D9DDE3;color:var(--ink-2)}
.md-view code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:#fff;
  padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.md-view mark{background:#FFF08A;color:inherit;padding:0 3px;border-radius:3px}
.md-view del{color:var(--muted)}
.md-view .md-empty{color:#BDC3CB}

/* PDF 문서 서식 편집 */
.md-wrap{display:grid;gap:0 20px}
.md-pane{min-width:0}
@media(max-width:899px){
  .md-wrap .md-pane{display:none}
  .md-wrap.edit .md-pane.edit{display:block}
  .md-wrap.pv .md-pane.pv{display:block}
}
@media(min-width:900px){
  .md-wrap{grid-template-columns:1fr 1fr}
  .md-wrap .md-pane{display:block}
  .md-seg{display:none}
}
#md-src{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px;line-height:1.65}
.md-tools{display:flex;flex-wrap:wrap;gap:6px}
.mdt{height:32px;min-width:34px;padding:0 10px;border-radius:9px;background:var(--surface);
  font-size:13px;font-weight:650;color:var(--ink-2);
  display:inline-flex;align-items:center;justify-content:center}
.mdt:active{background:var(--surface-2)}
.mdt.b{font-weight:800;color:var(--ink)}
.mdt.i{font-style:italic}
.mdt.s{text-decoration:line-through}
.mdt.c{font-family:ui-monospace,Menlo,monospace;font-size:12px}
.mdt.mk{background:#FFF08A;color:#6B5300}
.mdt.hd{font-weight:800;letter-spacing:-.02em}
.mdt.mk:active{background:#F2E07A}
.pdf-pv{border:1px solid var(--line);border-radius:var(--r-md);padding:20px;background:#fff}
.pdf-pv .p-md h1{font-size:23px;margin:0 0 8px;letter-spacing:-.02em;line-height:1.25}
.pdf-pv .p-md h2{font-size:16.5px;margin:20px 0 6px;letter-spacing:-.01em}
.pdf-pv .p-md h3{font-size:14px;margin:16px 0 4px}
.pdf-pv .p-md h4{font-size:13px;margin:12px 0 3px}
.pdf-pv .p-md p{margin:0 0 6px;font-size:13px;line-height:1.6;color:var(--ink-2)}
.pdf-pv .p-md ol{margin:0 0 8px;padding-left:20px;font-size:13px;color:var(--ink-2)}
.pdf-pv .p-md ul{margin:0 0 8px;padding-left:0;list-style:none;font-size:13px;color:var(--ink-2)}
.pdf-pv .p-md ul ul{margin:2px 0;padding-left:1.45em}
.pdf-pv .p-md ul > li{position:relative;padding-left:1.45em}
.pdf-pv .p-md ul > li::before{content:var(--mk, var(--bu0,"-"));position:absolute;left:0}
.pdf-pv .p-md ul ul > li::before{content:var(--mk, var(--bu1,"+"))}
.pdf-pv .p-md ul ul ul > li::before{content:var(--mk, var(--bu2,"*"))}
.pdf-pv .p-md li{margin:2px 0}
.pdf-pv .p-md hr{border:0;border-top:1px solid var(--ink);margin:14px 0}
.pdf-pv .p-md blockquote{margin:6px 0;padding-left:12px;border-left:3px solid var(--line);color:var(--muted)}
.pdf-pv .p-md code{font-family:ui-monospace,Menlo,monospace;font-size:12px;
  background:var(--surface);padding:1px 4px;border-radius:4px}
.pdf-pv .p-md del{color:var(--muted)}
.pdf-pv mark{background:#FFF08A;color:inherit;padding:0 3px;border-radius:3px}
.pdf-pv .p-md > :first-child{margin-top:0}
.pdf-pv .p-toc{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);
  padding:8px 0;margin:8px 0 4px}
.pdf-pv .p-toc div{display:flex;justify-content:space-between;gap:16px;font-size:12.5px;
  padding:2px 0;color:var(--ink-2)}
.pdf-pv .p-toc-s{font-weight:700;padding-top:7px!important;color:var(--ink)}
.pdf-pv .p-note{margin-top:10px}
.pdf-pv .p-cols{display:grid;gap:0 12px;align-items:start}
.pdf-pv .p-cols.n2{grid-template-columns:1fr 1fr}
.pdf-pv .p-cols.n3{grid-template-columns:1fr 1fr 1fr}
.pdf-pv .p-col{min-width:0}
.pdf-pv .p-field{border:1px solid #D6D6D6;border-radius:6px;padding:8px 9px;margin-bottom:8px}
.pdf-pv .p-field.empty{border-style:dashed;border-color:#E3E3E3}
.pdf-pv .p-field .lab{font-size:9px;font-weight:700;letter-spacing:.09em;color:#8A8A8A;
  margin-bottom:4px}
.pdf-pv .p-field .val{margin:0;white-space:pre-wrap;word-break:break-word;
  font-size:12.5px;line-height:1.55;color:var(--ink)}
.pdf-pv .p-kicker{font-size:11px;color:var(--muted);margin:0 0 10px}
.pdf-pv .p-empty{color:#B0B0B0;font-style:italic;font-size:12.5px}

/* 목차 섹션 */
.sec-row{display:flex;align-items:center;gap:10px;padding:16px 2px 8px}
.sec-row:first-child{padding-top:2px}
.sec-row-t{font-size:13px;font-weight:750;letter-spacing:.01em;flex:none;max-width:60%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-row-n{font-size:11.5px;color:var(--muted);flex:none}
.sec-row .line{flex:1;height:1px;background:var(--line);min-width:10px}
.sec-row .mini{flex:none;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.sec-row .mini:active{background:var(--surface-2)}
.sec-row .mini svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}
.strip-g{margin-top:12px}
.strip-g:first-child{margin-top:14px}
.strip-name{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:6px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip-g .strip{margin-top:0}
.outline-pv{margin-top:8px;display:flex;flex-direction:column;gap:3px}
.outline-pv span{font-size:12px;line-height:1.45}
.ol-s{font-weight:750;color:var(--ink)}
.ol-l{color:var(--ink-2);padding-left:14px}
.ol-more{color:var(--muted)}

/* 템플릿 편집 */
.tfield{border:1px solid var(--line);border-radius:var(--r-md);padding:12px;margin-bottom:10px}
.tfield-top{display:flex;align-items:center;gap:7px}
.tfield-n{width:22px;height:22px;flex:none;border-radius:7px;background:var(--surface);
  display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--ink-2);
  font-variant-numeric:tabular-nums}
.tfield input{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;
  background:#fff;outline:none}
.tfield input:focus{border-color:#B9CCFF;box-shadow:0 0 0 3px var(--accent-soft)}
.tfield input::placeholder{color:#BDC3CB}
.tfield-top input{flex:1;min-width:0;font-weight:650}
.tfield > input{margin-top:8px}
.tfield .chips{margin-top:9px}
.tfield .mini{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  color:var(--ink-2)}

.tfield .mini svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;
  stroke-linecap:round;stroke-linejoin:round}

.chip.sm{height:30px;padding:0 12px;font-size:12.5px}
.pv{border:1px solid var(--line);border-radius:var(--r-md);padding:14px;background:var(--surface)}
.pv textarea{pointer-events:none}
.muted-note{font-size:12.5px;color:var(--muted);line-height:1.6;margin:12px 2px 0}
.orphan{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.orphan textarea{background:var(--surface);color:var(--ink-2)}

/* ============================================================
   넓은 화면(아이패드) — 늘리지 않고 촘촘하게
   ============================================================ */

/* ============================================================
   인쇄 (PDF 내보내기)
   ============================================================ */

  .topbar,.tabbar,.app,.scrim,.toast{display:none!important}
  #printRoot{display:block!important}
  @page{size:A4;margin:16mm 15mm}

    -webkit-print-color-adjust:exact;print-color-adjust:exact}

    -webkit-print-color-adjust:exact;print-color-adjust:exact}

    page-break-after:avoid;break-after:avoid}

  .p-md h4{font-size:10pt;margin:5mm 0 1mm;page-break-after:avoid;break-after:avoid}
  .p-md p{margin:0 0 2mm}
  .p-md ol{margin:0 0 2.5mm;padding-left:6mm}
  .p-md ul{margin:0 0 2.5mm;padding-left:0;list-style:none}
  .p-md ul ul{margin:.5mm 0;padding-left:5mm}
  .p-md ul > li{position:relative;padding-left:5mm}
  .p-md ul > li::before{content:var(--mk, var(--bu0,"-"));position:absolute;left:0}
  .p-md ul ul > li::before{content:var(--mk, var(--bu1,"+"))}
  .p-md ul ul ul > li::before{content:var(--mk, var(--bu2,"*"))}
  .p-md li{margin:.6mm 0}
  .p-md hr{border:0;border-top:0.4mm solid #111;margin:5mm 0}
  .p-md blockquote{margin:2mm 0;padding-left:4mm;border-left:0.7mm solid #CCC;color:#555}
  .p-md code{font-family:ui-monospace,Menlo,monospace;font-size:9pt;
    background:#F1F1F1;padding:0 1mm;border-radius:1mm}
  .p-md del{color:#888}
  .p-md > :first-child{margin-top:0}

/* ============================================================
   1. 저장소
   ============================================================ */
const KEY = "lecture-notes.v1";
const BAK = "lecture-notes.v1.bak";
const Store = {
  ok:true, mem:null,
  read(){
    try{
      const raw = localStorage.getItem(KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){
      /* 주 저장본이 깨졌으면 직전 저장본으로 되살린다 */
      try{
        const bak = localStorage.getItem(BAK);
        if(bak){
          const data = JSON.parse(bak);
          this.restored = true;
          return data;
        }
      }catch(e2){}
      this.ok = false;
      return this.mem;
    }
    try{
      const bak = localStorage.getItem(BAK);
      if(bak && !localStorage.getItem(KEY)) return JSON.parse(bak);
    }catch(e3){}
    return null;
  },
  write(data){
    this.mem = data;
    const text = JSON.stringify(data);
    try{
      /* 새로 쓰기 전에 직전 내용을 백업해 둔다.
         쓰는 도중 문제가 생겨도 한 세대 전으로 되살릴 수 있다. */
      const prev = localStorage.getItem(KEY);
      if(prev && prev !== text){
        try{ localStorage.setItem(BAK, prev); }catch(e0){}
      }
      localStorage.setItem(KEY, text);
      lastWriteStamp = data.settings && data.settings.savedAt;
      return true;
    }
    catch(e){
      /* 공간이 모자라면 백업을 비워서라도 본 데이터를 지킨다 */
      try{
        localStorage.removeItem(BAK);
        localStorage.setItem(KEY, text);
        lastWriteStamp = data.settings && data.settings.savedAt;
        return true;
      }catch(e2){ this.ok=false; return false; }
    }
  }
};

const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
/* 다른 탭이 먼저 저장했는지 보고, 그랬다면 그쪽 내용을 받아들인다 */
let lastWriteStamp = null;
const nowISO = () => new Date().toISOString();

function blank(){
  return { schema:2, courses:[], templates:[],
    settings:{ lastSeenVersion:null, savedAt:null, defaultTemplateId:null } };
}
let S = Store.read() || blank();
const restoredFromBackup = !!Store.restored;
if(!S.courses) S = blank();
if(!S.settings) S.settings = { lastSeenVersion:null, savedAt:null };

/* ============================================================
   2. 자동저장
   ============================================================ */
let saveTimer = null, dirty = false;
function touch(){
  dirty = true;
  paintSaveState();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(commit, 600);
}
let saveFailed = false, lastGoodAt = null;
function commit(){
  clearTimeout(saveTimer);
  const stamp = nowISO();
  const prev = S.settings.savedAt;
  S.settings.savedAt = stamp;
  const ok = Store.write(S);
  if(ok){
    dirty = false;
    lastGoodAt = stamp;
    if(saveFailed){ saveFailed = false; renderSaveBanner(); }
  }else{
    /* 저장이 안 됐으면 '저장됨'으로 보이게 두지 않는다 */
    S.settings.savedAt = prev;
    dirty = true;
    if(!saveFailed){ saveFailed = true; renderSaveBanner(); }
    scheduleRetry();
  }
  paintSaveState();
  return ok;
}
/* 저장에 실패하면 조용히 포기하지 않고 계속 다시 시도한다 */
let retryTimer = null;
function scheduleRetry(){
  clearTimeout(retryTimer);
  retryTimer = setTimeout(()=>{ if(dirty) commit(); }, 5000);
}
function renderSaveBanner(){
  let el = document.getElementById("saveAlert");
  if(!saveFailed){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement("div");
    el.id = "saveAlert";
    el.className = "save-alert";
    document.body.appendChild(el);
  }
  el.innerHTML = `<b>저장되지 않고 있습니다.</b>
    기기 저장 공간이 찼거나 브라우저가 저장을 막고 있습니다.
    지금 화면의 내용은 그대로 있으니, 백업 파일로 먼저 내보내 주세요.
    <button class="btn primary" data-act="export-json">백업 내보내기</button>`;
}
function paintSaveState(){
  document.querySelectorAll("[data-savestate]").forEach(el=>{
    const dot = el.querySelector(".dot");
    if(dot) dot.classList.toggle("pending", dirty);
    const t = el.querySelector("[data-savetext]");
    if(!t) return;
    if(saveFailed){
      t.textContent = "저장 실패 — 백업을 내보내 주세요"
        + (lastGoodAt ? " (마지막 저장 " + fmtFull(lastGoodAt) + ")" : "");
      if(dot) dot.classList.add("fail");
    }else{
      if(dot) dot.classList.remove("fail");
      t.textContent = dirty ? "저장 중…"
        : (S.settings.savedAt ? "저장됨 · " + fmtFull(S.settings.savedAt) : "아직 저장된 내용이 없습니다");
    }
  });
}
/* 화면을 떠나는 모든 경로에서 저장한다.
   iOS 사파리는 visibilitychange를 놓치는 경우가 있어 blur·pagehide도 함께 건다. */
function flush(){ if(dirty) commit(); }
/* visibilitychange는 document에서 일어난다. window에 걸면 받지 못한다. */
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState !== "visible") flush(); });
addEventListener("pagehide", flush);
addEventListener("beforeunload", flush);
addEventListener("blur", flush);
addEventListener("freeze", flush);

/* 다른 탭에서 저장되면 알려 준다. 쓰던 내용을 말없이 덮어쓰지 않는다. */
addEventListener("storage", e=>{
  if(e.key !== KEY || !e.newValue) return;
  if(e.newValue === JSON.stringify(S)) return;
  if(dirty){
    /* 여기서 쓰던 내용이 있으면 사용자가 고르게 한다 */
    if(document.getElementById("saveAlert")) return;
    const el = document.createElement("div");
    el.id = "saveAlert";
    el.className = "save-alert";
    el.innerHTML = `<b>다른 탭에서 내용이 바뀌었습니다.</b>
      여기서 쓰던 내용과 다릅니다. 어느 쪽을 남길지 골라 주세요.
      <button class="btn primary" data-act="keep-mine">여기 내용 저장</button>
      <button class="btn ghost" data-act="keep-theirs">다른 탭 내용 열기</button>`;
    document.body.appendChild(el);
  }else{
    /* 쓰던 게 없으면 조용히 최신 내용으로 맞춘다 */
    try{
      const incoming = JSON.parse(e.newValue);
      if(incoming && incoming.courses){ S = incoming; migrate(); render(); }
    }catch(err){}
  }
});

const esc = s => String(s??"").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const p2 = n => String(n).padStart(2,"0");

function fmtFull(iso){
  if(!iso) return "-";
  const d = new Date(iso);
  return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())} ${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
}
function fmtDate(iso){
  if(!iso) return "-";
  const d = new Date(iso);
  return `${d.getFullYear()}.${p2(d.getMonth()+1)}.${p2(d.getDate())}`;
}
function fmtRel(iso){
  if(!iso) return "기록 없음";
  const diff = Date.now() - new Date(iso).getTime();
  const m = Math.floor(diff/60000);
  if(m < 1) return "방금";
  if(m < 60) return m + "분 전";
  const h = Math.floor(m/60);
  if(h < 24) return h + "시간 전";
  const d = Math.floor(h/24);
  if(d < 7) return d + "일 전";
  return fmtDate(iso);
}
const COLOR_PRESETS = ["#ff8a4d","#50b1f7","#4c86f5","#7a5af0","#14a896","#e75b60"];
const LEGACY_COLORS = { blue:"#4c86f5", violet:"#7a5af0", teal:"#14a896",
  amber:"#eda01a", rose:"#e75b60", slate:"#6e7885" };
function normHex(v){
  if(typeof v !== "string") return null;
  let x = v.trim();
  if(/^[0-9a-fA-F]{6}$/.test(x)) x = "#"+x;
  if(/^#[0-9a-fA-F]{3}$/.test(x)) x = "#"+x[1]+x[1]+x[2]+x[2]+x[3]+x[3];
  return /^#[0-9a-fA-F]{6}$/.test(x) ? x.toLowerCase() : null;
}
function toHSL(hex){
  const n = parseInt(hex.slice(1),16);
  const r=((n>>16)&255)/255, g=((n>>8)&255)/255, b=(n&255)/255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2;
  let h=0, sat=0;
  if(mx!==mn){
    const d=mx-mn;
    sat = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    h = mx===r ? (g-b)/d + (g<b?6:0) : mx===g ? (b-r)/d+2 : (r-g)/d+4;
    h/=6;
  }
  return [h,sat,l];
}
function fromHSL(h,s,l){
  const f=(p,q,t)=>{ t=(t+1)%1;
    return t<1/6 ? p+(q-p)*6*t : t<1/2 ? q : t<2/3 ? p+(q-p)*(2/3-t)*6 : p; };
  let r,g,b;
  if(s===0){ r=g=b=l; }
  else{
    const q = l<0.5 ? l*(1+s) : l+s-l*s, p = 2*l-q;
    r=f(p,q,h+1/3); g=f(p,q,h); b=f(p,q,h-1/3);
  }
  return "#" + [r,g,b].map(v=>Math.round(v*255).toString(16).padStart(2,"0")).join("");
}
/* 밝기·채도를 따로 움직여 레퍼런스의 색 관계를 어떤 색에서도 재현한다 */
function adjust(hex, dl, ds){
  const [h,s,l] = toHSL(normHex(hex) || COLOR_PRESETS[0]);
  return fromHSL(h, Math.max(0,Math.min(1,s+(ds||0))), Math.max(0,Math.min(1,l+(dl||0))));
}
function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const c = [(n>>16)&255,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*amt))));
  return "#" + c.map(v=>v.toString(16).padStart(2,"0")).join("");
}
const rgbOf = hex => {
  const n = parseInt(hex.slice(1),16);
  return ((n>>16)&255)+","+((n>>8)&255)+","+(n&255);
};
/* 사용자가 고른 한 가지 색에서 폴더 뒷면·그림자 색을 자동 계산 */
function colorVars(hex){
  const h = normHex(hex) || COLOR_PRESETS[0];
  return `--f-mid:${h};--f-back:${adjust(h,-.10,0)};--fsh:${rgbOf(adjust(h,-.24,0))}`;
}
const STATUS = { todo:"안 봄", doing:"보는 중", done:"완료" };

/* 노트 템플릿 — 칸 구성은 사용자가 직접 정의한다.

/* 칸은 6칸 그리드 위에 놓인다. w=6이면 한 줄 전체, w=3이면 절반, w=2면 1/3 */
const LEGACY_SIZES = { s:2, m:4, l:10 };
const COLCOUNTS = [{v:1,n:"1단"},{v:2,n:"2단"},{v:3,n:"3단"}];
/* col = 0 이면 모든 단을 가로로 걸치고, 1~3 이면 해당 단에 세로로 쌓인다 */
const colName = i => i===0 ? "가로 전체" : i+"단";
const HEIGHTS = [{v:2,n:"짧게"},{v:4,n:"보통"},{v:10,n:"길게"}];
const MAXROWS = 30;

const DEFAULT_FIELDS = [
  { k:"summary",   label:"핵심 요약",      col:0, rows:2,  hint:"3줄 이내", ph:"이 회차에서 결국 무엇을 배웠는지 한두 문장으로." },
  { k:"body",      label:"강의 노트",      col:1, rows:16, hint:"본문",     ph:"들으면서 그대로 적어두는 곳. 시간(12:30)이나 슬라이드 번호를 함께 적으면 다시 찾기 쉽습니다." },

  { k:"action",    label:"해야 할 일",     col:2, rows:4,  hint:"",        ph:"실습, 복습, 과제" }

const clampInt = (v,lo,hi,dflt) =>
  (typeof v==="number" && isFinite(v)) ? Math.max(lo,Math.min(hi,Math.round(v))) : dflt;
/* 줄 수를 실제 높이로. 노트 화면과 레이아웃 편집기가 같은 식을 쓴다. */
const boxHeight = rows => `calc(${rows} * 1.62em + 26px)`;
function builtinTemplate(){
  return { id:"tpl_default", name:"기본 강의 노트",
    cols:DEFAULT_COLS, fields:DEFAULT_FIELDS.map(f=>Object.assign({},f)),
    createdAt:nowISO(), updatedAt:null };

const LESSON_META = { id:1, type:1, templateId:1, label:1, status:1, createdAt:1, updatedAt:1 };
/* 노트 칸의 키는 summary·body 같은 옛 이름이거나 "f_..." 형태다.
   ...Id / ...At 로 끝나는 것은 앱이 쓰는 내부 항목이므로 내용으로 보지 않는다. */
const isInternalKey = k => !!LESSON_META[k] || /(Id|At)$/.test(k);

/* 목록 구분점 — 들여쓰기 깊이별로 사용자가 정한다.
   마크다운 글자는 "-" 그대로 두고, 보여줄 때만 이 기호를 쓴다. */
const BULLET_DEPTHS = 6;
/* 기본값은 마크다운이 모두 목록으로 인정하는 -, +, * 를 번갈아 쓴다.
   서로 달라서 단계가 눈에 보이고, 다른 앱에 붙여넣어도 목록으로 열린다. */
const DEFAULT_BULLETS = ["-","+","*","-","+","*"];
function bulletList(){
  const v = S.settings.bullets;
  const out = DEFAULT_BULLETS.slice();
  if(Array.isArray(v)) v.forEach((x,i)=>{
    if(i < BULLET_DEPTHS && typeof x === "string" && x.trim()) out[i] = x.trim().slice(0,4);
  });
  return out;
}
function applyBullets(){
  const b = bulletList(), r = document.documentElement.style;
  for(let i = 0; i < BULLET_DEPTHS; i++) r.setProperty("--bu" + i, JSON.stringify(b[i]));
}
const DEFAULT_EMOJIS = [
  { e:"⭐", n:"중요" }, { e:"✅", n:"완료" }, { e:"❓", n:"질문" },
  { e:"📌", n:"기억" }, { e:"⚠️", n:"주의" }, { e:"💡", n:"아이디어" },
  { e:"🔁", n:"복습" }, { e:"📝", n:"과제" }
];
function emojiList(){

  if(!Array.isArray(v)) return DEFAULT_EMOJIS.map(x=>Object.assign({ id:uid() }, x));

}
function migrate(){
  if(!Array.isArray(S.templates) || !S.templates.length) S.templates = [builtinTemplate()];
  S.templates.forEach(t=>{
    t.id = t.id || uid();
    t.name = typeof t.name==="string" ? t.name : "이름 없는 템플릿";
    const orig = Array.isArray(t.fields) ? t.fields.slice() : [];
    const hadNarrow = orig.some(f=>f.w && f.w < 6);
    t.fields = orig.map(f=>({
      k: f.k || ("f_"+uid()),
      label: f.label || "칸",
      hint: f.hint || "",
      ph: f.ph || "",
      col: clampInt(f.col, 0, 3, f.w>=6 ? 0 : (f.w ? 1 : 0)),
      rows: clampInt(f.rows, 1, MAXROWS, LEGACY_SIZES[f.size] || (f.big ? 10 : 4))
    }));
    if(!t.fields.length) t.fields = [{ k:"f_"+uid(), label:"노트", hint:"", ph:"", col:0, rows:10 }];
    /* 예전 너비(w) 설정이 있으면 단 배치로 한 번만 옮긴다 */
    if(t.cols === undefined){
      const minW = Math.min.apply(null, orig.map(f=>f.w || 6).concat([6]));
      t.cols = hadNarrow ? (minW <= 2 ? 3 : 2) : 1;
      if(hadNarrow){
        let ci = 0;
        t.fields.forEach((f,i)=>{
          const w = orig[i] && orig[i].w ? orig[i].w : 6;
          if(w >= 6){ f.col = 0; ci = 0; }
          else { ci = (ci % t.cols) + 1; f.col = ci; }
        });
      }
    }
    t.cols = clampInt(t.cols, 1, 3, 1);
    if(t.cols > 1) t.fields.forEach(f=>{ if(f.col > t.cols) f.col = t.cols; });
  });
  if(!S.settings || typeof S.settings !== "object") S.settings = {};
  if(!Array.isArray(S.settings.bullets)) S.settings.bullets = DEFAULT_BULLETS.slice();
  S.settings.bullets = bulletList();
  if(!Array.isArray(S.settings.emojis))
    S.settings.emojis = DEFAULT_EMOJIS.map(x=>({ id:uid(), e:x.e, n:x.n }));
  S.settings.emojis = S.settings.emojis
    .filter(x=>x && typeof x === "object" && typeof x.e === "string" && x.e.trim())
    .map(x=>({ id:x.id || uid(), e:String(x.e).trim().slice(0,8),
               n:typeof x.n === "string" ? x.n.slice(0,20) : "" }))
    .slice(0, 40);
  if(S.settings.pdfStyle !== "text") S.settings.pdfStyle = "template";
  /* pdfDoc()은 읽을 때마다 기본값으로 채우므로 여기서 손대지 않는다 (초기화 순서 문제) */
  if(!S.settings.defaultTemplateId || !S.templates.some(t=>t.id===S.settings.defaultTemplateId))
    S.settings.defaultTemplateId = S.templates[0].id;
  /* 손상된 백업이 들어와도 화면이 열리도록 빠진 항목을 채운다 */
  S.courses = (Array.isArray(S.courses) ? S.courses : []).filter(c=>c && typeof c==="object");
  S.courses.forEach(c=>{
    c.id = c.id || uid();
    c.title = typeof c.title === "string" && c.title.trim() ? c.title : "이름 없는 강의";
    c.source = typeof c.source === "string" ? c.source : "";
    c.createdAt = c.createdAt || nowISO();
    if(!c.templateId || !S.templates.some(t=>t.id===c.templateId))
      c.templateId = S.settings.defaultTemplateId;
    c.color = normHex(c.color) || normHex(LEGACY_COLORS[c.color]) || COLOR_PRESETS[0];
    c.lessons = (Array.isArray(c.lessons) ? c.lessons : []).filter(x=>x && typeof x==="object");
    c.lessons.forEach(x=>{
      x.id = x.id || uid();
      x.type = x.type==="section" ? "section" : "lesson";
      x.label = typeof x.label === "string" && x.label.trim() ? x.label
        : (x.type==="section" ? "이름 없는 섹션" : "이름 없는 회차");
      if(x.type === "lesson" && !STATUS[x.status]) x.status = "todo";
      x.createdAt = x.createdAt || nowISO();
      if(x.updatedAt === undefined) x.updatedAt = null;
    });
  });
  S.schema = 2;
  Store.write(S);   /* 마이그레이션 결과를 즉시 보존 (savedAt은 건드리지 않음) */
}

const findCourse = id => S.courses.find(c=>c.id===id);
const findLesson = (c,id) => c && c.lessons.find(l=>l.id===id);
const findTpl = id => S.templates.find(t=>t.id===id);
const tplOf = c => findTpl(c.templateId) || S.templates[0];
/* 회차에 templateId가 있으면 그 노트만 다른 템플릿을 쓴다 */
const tplFor = (c,l) => (l && l.templateId && findTpl(l.templateId)) || tplOf(c);
const fieldsOf = (c,l) => tplFor(c,l).fields;
const isTplOverridden = (c,l) => !!(l && l.templateId && findTpl(l.templateId)
  && l.templateId !== c.templateId);
const rowsOf = f => clampInt(f.rows,1,MAXROWS,4);
const colsOf = t => clampInt(t.cols,1,3,1);
function layoutBlocks(fields, cols){
  const blocks = [];
  let cur = null;
  fields.forEach(f=>{
    if(cols === 1 || !f.col){
      blocks.push({ full:f });
      cur = null;
    }else{
      if(!cur){ cur = { cols:Array.from({length:cols},()=>[]) }; blocks.push(cur); }
      cur.cols[Math.min(cols, Math.max(1, f.col)) - 1].push(f);
    }
  });
  return blocks;
}
function renderBlocks(fields, cols, one, cls){
  const wrap = (cls && cls.wrap) || "ncols";
  const colc = (cls && cls.col) || "ncol";
  return layoutBlocks(fields, cols).map(b =>
    b.full ? one(b.full)
      : `<div class="${wrap} n${cols}">${b.cols.map(list=>
          `<div class="${colc}">${list.map(one).join("")}</div>`).join("")}</div>`
  ).join("");
}
const tplName = t => (t.name||"").trim() || "이름 없는 템플릿";

function newLesson(label){
  return { id:uid(), type:"lesson", label:label, status:"todo",
    createdAt:nowISO(), updatedAt:null };
}
function newSection(label){
  return { id:uid(), type:"section", label:label, createdAt:nowISO(), updatedAt:null };
}
/* 목차는 섹션과 회차가 한 배열에 순서대로 들어간다.
   섹션은 제목일 뿐이고 노트를 갖지 않으며, 번호는 회차에만 매긴다. */
const isSection = x => x.type === "section";
const lessonsOf = c => c.lessons.filter(x=>!isSection(x));
const lessonNo = (c,l) => lessonsOf(c).indexOf(l) + 1;
function sectionFor(c,l){
  const i = c.lessons.indexOf(l);
  for(let j=i-1;j>=0;j--) if(isSection(c.lessons[j])) return c.lessons[j];
  return null;
}
/* 해당 섹션 묶음의 끝 자리 (secId 없으면 첫 섹션 앞 묶음) */
function insertPos(c, secId){
  if(!secId){
    const i = c.lessons.findIndex(isSection);
    return i < 0 ? c.lessons.length : i;
  }
  const i = c.lessons.findIndex(x=>x.id===secId);
  if(i < 0) return c.lessons.length;
  let j = i + 1;
  while(j < c.lessons.length && !isSection(c.lessons[j])) j++;
  return j;
}
function groupsOf(c){
  const gs=[]; let cur={ sec:null, items:[] };
  c.lessons.forEach(x=>{
    if(isSection(x)){
      if(cur.sec || cur.items.length) gs.push(cur);
      cur = { sec:x, items:[] };
    } else cur.items.push(x);
  });
  if(cur.sec || cur.items.length) gs.push(cur);
  return gs;
}
/* 현재 템플릿에 없지만 값이 남아 있는 칸 */
function orphanKeys(c,l){
  const ks = {}; fieldsOf(c,l).forEach(f=>ks[f.k]=1);
  return Object.keys(l).filter(k=>!isInternalKey(k) && !ks[k]
    && typeof l[k]==="string" && l[k].trim() !== "");
}
function labelForKey(k){
  for(const t of S.templates){
    const f = t.fields.find(x=>x.k===k);
    if(f) return f.label;
  }
  return "이전 내용";
}
function noteText(c,l){
  return fieldsOf(c,l).map(f=>l[f.k]||"").concat(orphanKeys(c,l).map(k=>l[k])).join(" ");
}
function hasText(c,l){
  return fieldsOf(c,l).some(f=>(l[f.k]||"").trim()!=="") || orphanKeys(c,l).length>0;
}
const doneCount = c => lessonsOf(c).filter(l=>l.status==="done").length;
const writtenCount = c => lessonsOf(c).filter(l=>hasText(c,l)).length;
function stripMd(x){
  return x
    .replace(/^#{1,4}\s+/gm, "")
    .replace(new RegExp("^\\s*(?:" + bulletMarks().map(reEsc).join("|") + ")\\s+", "gm"), "")
    .replace(/^\s*&gt;\s?/gm, "").replace(/^\s*>\s?/gm, "")
    .replace(/\*\*([^*]+)\*\*/g, "$1")
    .replace(/==([^=\n]+)==/g, "$1")
    .replace(/~~([^~]+)~~/g, "$1")
    .replace(/`([^`]+)`/g, "$1")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1$2");
}
function snippet(c, l, n){
  let t = "";
  for(const f of fieldsOf(c,l)){
    const v = (l[f.k]||"").trim();
    if(v){ t = v; break; }
  }
  t = stripMd(t).replace(/\s+/g," ").trim();
  return t ? (t.length>n ? t.slice(0,n)+"…" : t) : "";
}

function route(){
  const h = location.hash.replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  if(!parts.length) return { name:"home" };
  if(parts[0]==="all") return { name:"all" };
  if(parts[0]==="settings") return { name:"settings" };
  if(parts[0]==="t" && parts[1]) return { name:"template", tid:parts[1] };
  if(parts[0]==="pdfdoc") return { name:"pdfdoc" };
  if(parts[0]==="emoji") return { name:"emoji" };
  if(parts[0]==="bullet") return { name:"bullet" };
  if(parts[0]==="c" && parts[1]){
    if(parts[2]==="l" && parts[3]) return { name:"note", cid:parts[1], lid:parts[3] };
    return { name:"course", cid:parts[1] };
  }
  return { name:"home" };
}
const go = hash => { location.hash = hash; };
addEventListener("hashchange", ()=>{ if(dirty) commit(); closeLayer(); render(); window.scrollTo(0,0); });
addEventListener("scroll", ()=>{

}, { passive:true });

function render(){
  activeNoteTA = null;
  unmountNoteTools();
  const r = route();
  if(r.name==="home") return renderHome();
  if(r.name==="all") return renderAll();
  if(r.name==="settings") return renderSettings();
  if(r.name==="pdfdoc") return renderPdfDoc();
  if(r.name==="emoji") return renderEmoji();
  if(r.name==="bullet") return renderBullet();
  if(r.name==="template"){
    const t = findTpl(r.tid);
    if(!t) return go("#/settings");
    return renderTemplate(t);
  }
  if(r.name==="course"){
    const c = findCourse(r.cid);
    if(!c) return go("#/");
    return renderCourse(c);
  }
  if(r.name==="note"){
    const c = findCourse(r.cid), l = findLesson(c, r.lid);
    if(!c || !l) return go(c ? "#/c/"+c.id : "#/");
    if(isSection(l)) return go("#/c/"+c.id);
    return renderNote(c, l);
  }
  renderHome();
}

const F_BACK = "M11 2h18c4 0 6 1.3 7.6 3.4l1.8 2.3c1.5 1.9 3.4 2 6 2H101a10 10 0 0 1 10 10v69a12 12 0 0 1-12 12H13A12 12 0 0 1 1 88.7V12A10 10 0 0 1 11 2z";

    <defs>
      <linearGradient id="b${gid}" x1="0" y1="0" x2="0.2" y2="1">

function mountNoteTools(){
  let bar = document.getElementById("noteTools");
  if(!bar){
    const host = document.createElement("div");
    host.innerHTML = noteToolsHTML();

    /* 버튼을 눌러도 입력칸에서 포커스가 빠지지 않도록 기본 동작을 막는다 */
    bar.addEventListener("mousedown", e=>e.preventDefault());
    bar.addEventListener("touchstart", e=>{
      if(e.cancelable) e.preventDefault();
    }, { passive:false });
    /* 터치에서는 preventDefault 때문에 click이 안 올 수 있어 직접 처리 */
    bar.addEventListener("touchend", e=>{
      const b = e.target.closest("[data-act='note-md'],[data-act='note-emoji'],[data-act='go-emoji']");

      if(b.dataset.act === "note-md") noteMdApply(b.dataset.v);
      else if(b.dataset.act === "note-emoji") noteEmojiInsert(b.dataset.v);

/* Enter를 누르면 목록·인용을 이어 준다. 빈 항목에서 Enter면 목록을 끝낸다. */
/* 한글·일본어처럼 글자를 조합해 넣는 중인지 본다.
   아이폰에서는 isComposing이 false로 오는 일이 있어 keyCode 229와
   compositionstart/end 로 직접 따라간 상태를 함께 본다. */
let imeOn = false;
const isComposingNow = e =>
  imeOn || e.isComposing === true || e.keyCode === 229 || e.which === 229;

/* 조합 중에는 Enter를 가로채면 안 된다.
   가로채면 조합 중이던 글자가 확정되면서 새 줄로 딸려 들어간다.
   그래서 줄바꿈은 브라우저에 맡기고, 끝난 뒤에 목록 기호만 붙인다. */
function markerAfterEnter(ta, prefix){
  let tries = 0;
  const put = ()=>{
    if(!ta.isConnected) return;
    const pos = ta.selectionStart;
    if(pos === ta.selectionEnd && pos > 0 && ta.value[pos-1] === "\n"){
      editTA(ta, pos, pos, prefix, pos + prefix.length);
      renumber(ta);
      ta.dispatchEvent(new Event("input", { bubbles:true }));
      return;
    }
    if(++tries < 6) setTimeout(put, 16);
  };
  setTimeout(put, 0);
}
function autoContinueList(ta, e){
  if(e.key !== "Enter" || e.shiftKey) return false;
  const v = ta.value, pos = ta.selectionStart;
  if(pos !== ta.selectionEnd) return false;
  const start = v.lastIndexOf("\n", pos - 1) + 1;
  const line = v.slice(start, pos);
  const sp = splitLine(line);
  if(!sp.marker || /^#{1,4}\s+/.test(sp.marker)) return false;

  const composing = isComposingNow(e);
  if(!sp.body.trim()){
    if(composing) return false;
    e.preventDefault();
    editTA(ta, start, pos, "", start);
    renumber(ta);
    ta.dispatchEvent(new Event("input", { bubbles:true }));
    return true;
  }

  const m = /^(\d+)([.)])\s+/.exec(sp.marker);
  const next = m ? (parseInt(m[1],10) + 1) + m[2] + " " : sp.marker;
  if(composing){
    markerAfterEnter(ta, sp.indent + next);
    return false;          /* 줄바꿈은 브라우저가 한다 */
  }
  e.preventDefault();
  const ins = "\n" + sp.indent + next;
  editTA(ta, pos, pos, ins, pos + ins.length);
  renumber(ta);
  ta.dispatchEvent(new Event("input", { bubbles:true }));
  return true;
}
function noteEmojiInsert(ch){
  const ta = activeNoteTA;
  if(!ta || !ta.isConnected){
    activeNoteTA = null; showNoteTools(false);
    toast("먼저 글을 쓸 칸을 눌러 주세요");
    return;
  }
  const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd;
  const needSpace = a > 0 && !/\s$/.test(v.slice(0,a));
  const ins = (needSpace ? " " : "") + ch + " ";
  editTA(ta, a, b, ins, a + ins.length);
  ta.focus();
  ta.dispatchEvent(new Event("input", { bubbles:true }));
}
function curLine(ta){
  const v = ta.value;
  const s0 = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  let e0 = v.indexOf("\n", ta.selectionStart);
  if(e0 < 0) e0 = v.length;
  return v.slice(s0, e0);
}
function noteMdApply(key){
  const ta = activeNoteTA;
  if(!ta || !ta.isConnected){
    activeNoteTA = null; showNoteTools(false);
    toast("먼저 글을 쓸 칸을 눌러 주세요");
    return;

function bindIME(ta){
  ta.addEventListener("compositionstart", ()=>{ imeOn = true; });
  ta.addEventListener("compositionend", ()=>{ imeOn = false; });
}
function bindNoteField(ta){
  bindIME(ta);
  ta.addEventListener("keydown", e=>{
    if(autoContinueList(ta, e)) return;
    if(e.key === "Tab" && !isComposingNow(e)){
      e.preventDefault();
      mdIndent(ta, e.shiftKey ? -1 : 1);
      ta.dispatchEvent(new Event("input", { bubbles:true }));
    }
  });
  ta.addEventListener("focus", ()=>{ activeNoteTA = ta; showNoteTools(true); });
  ta.addEventListener("blur", ()=>{
    /* 도구 버튼을 누르는 중이거나 다른 노트 칸으로 옮겨가는 중이면 닫지 않는다 */

      const el = document.activeElement;

/* 입력 중에는 늘리기만 한다. 타이핑 도중 height를 auto로 되돌리면
   iOS에서 자동수정·텍스트 대치 후보가 취소된다. 줄이는 계산은 포커스가 빠질 때. */
function grow(ta, full){
  if(full){
    ta.style.height = "auto";
    ta.style.height = (ta.scrollHeight + 2) + "px";
    return;
  }
  if(ta.scrollHeight > ta.clientHeight) ta.style.height = (ta.scrollHeight + 2) + "px";
}

/* 포인터 이벤트 하나로 마우스·펜슬·손가락을 모두 처리 */
function bindResize(t){
  const grid = document.getElementById("layGrid");
  if(!grid) return;
  grid.querySelectorAll(".rz").forEach(h=>{
    h.addEventListener("pointerdown", e=>{
      const f = t.fields.find(x=>x.k===h.dataset.k);
      if(!f) return;
      e.preventDefault();
      const cell = h.closest(".lay");
      const ta = cell.querySelector("textarea");
      const tag = cell.querySelector(".lay-size");
      const lh = parseFloat(getComputedStyle(ta).lineHeight) || 26;
      const y0 = e.clientY;
      let rows = f.rows;
      try{ h.setPointerCapture(e.pointerId); }catch(err){}
      const move = ev=>{
        rows = Math.max(1, Math.min(MAXROWS, f.rows + Math.round((ev.clientY-y0)/lh)));
        ta.style.minHeight = boxHeight(rows);
        if(tag) tag.textContent = rows + "줄";
      };
      const done = ()=>{
        h.removeEventListener("pointermove", move);
        h.removeEventListener("pointerup", done);
        h.removeEventListener("pointercancel", done);
        if(rows !== f.rows){
          f.rows = rows; t.updatedAt = nowISO();
          commit(); render();
        }
      };
      h.addEventListener("pointermove", move);
      h.addEventListener("pointerup", done);
      h.addEventListener("pointercancel", done);
    });
  });
}

/* 선택 바깥을 한 겹씩 벗겨보며 같은 표시로 감싼 지점을 찾는다 (최대 3겹).
   겹칠 때 쓰이는 표시만 보고, 긴 것부터 맞춰 '*'가 '**'를 먹지 않게 한다. */
function outerWrap(v, a, b, mark){
  const n = mark.length;
  const marks = ["**", "==", "~~", "`", "*"];
  let s = a, e = b;
  for(let depth = 0; depth < 3; depth++){
    if(v.slice(s - n, s) === mark && v.slice(e, e + n) === mark) return { s: s - n, e };
    let moved = false;
    for(const m of marks){
      if(v.slice(s - m.length, s) === m && v.slice(e, e + m.length) === m){
        s -= m.length; e += m.length; moved = true; break;
      }
    }
    if(!moved) return null;
  }
  return null;
}
function mdWrap(ta, mark){
  const v = ta.value, a = ta.selectionStart, b = ta.selectionEnd, n = mark.length;
  const sel = v.slice(a,b);
  /* '*'는 '**'(굵게)와 헷갈리기 쉬워, 굵게가 걸린 자리에서는 해제하지 않고 덧씌운다 */
  const boldClash = mark === "*" &&
    (sel.slice(0,2) === "**" || sel.slice(-2) === "**" ||
     v.slice(a-2,a) === "**" || v.slice(b,b+2) === "**");
  if(!boldClash && sel.length >= 2*n && sel.slice(0,n) === mark && sel.slice(-n) === mark){
    const inner = sel.slice(n, -n);
    editTA(ta, a, b, inner, a, a + inner.length);
  } else if(!boldClash && v.slice(a-n, a) === mark && v.slice(b, b+n) === mark){
    editTA(ta, a-n, b+n, sel, a-n, b-n);
  } else if(!boldClash && outerWrap(v, a, b, mark)){
    /* **==글==** 처럼 바깥 겹에 같은 표시가 있으면 그 겹만 벗긴다 */
    const o = outerWrap(v, a, b, mark);
    editTA(ta, o.e, o.e + n, "");
    editTA(ta, o.s, o.s + n, "", a - n, b - n);
  } else {
    editTA(ta, a, b, mark + sel + mark, a+n, a+n+sel.length);
  }
}
/* 글상자를 고칠 때는 setRangeText를 쓴다.
   value를 통째로 바꾸면 실행취소가 끊기고,
   아이폰에서 자동완성·예측 변환이 남아 이전 글자가 되살아난다. */
function editTA(ta, start, end, text, selStart, selEnd){
  let done = false;
  /* 글자를 "직접 타이핑한 것처럼" 넣어야 되돌리기(Cmd+Z)가 작동한다.
     execCommand는 오래된 방식이지만 사파리에서 되돌리기가 가장 확실하다. */
  try{
    if(document.activeElement === ta && typeof document.execCommand === "function"){
      ta.setSelectionRange(start, end);
      done = document.execCommand("insertText", false, text);
    }
  }catch(e){ done = false; }
  if(!done && typeof ta.setRangeText === "function"){
    try{ ta.setRangeText(text, start, end, "preserve"); done = true; }catch(e){}
  }
  if(!done) ta.value = ta.value.slice(0,start) + text + ta.value.slice(end);
  if(selStart !== undefined){
    const n = ta.value.length;
    ta.selectionStart = Math.max(0, Math.min(selStart, n));
    ta.selectionEnd = Math.max(ta.selectionStart, Math.min(selEnd === undefined ? selStart : selEnd, n));
  }
}
const INDENT = "  ";
const reEsc = x => String(x).replace(/[.*+?^${}()|[\]\\-]/g, "\\$&");
/* 목록 표시는 사용자가 정한 기호를 그대로 글자로 넣는다.
   그래야 미리보기로 바꾸지 않아도 몇 단계인지 눈에 보인다.
   기본 -, *, + 도 늘 함께 인식해 예전 노트가 그대로 열린다. */
let _mkRe = null, _mkKey = "", _ulRe = null;
function bulletMarks(){
  return [...new Set(bulletList().concat(["-","*","+"]))].filter(Boolean);
}
function buildMarkerRe(){
  const key = bulletMarks().join("\u0000");
  if(_mkRe && _mkKey === key) return;
  const alt = bulletMarks().map(reEsc).join("|");
  _mkKey = key;
  _mkRe = new RegExp("^(\\s*)(#{1,4}\\s+|(?:" + alt + ")\\s+|\\d+[.)]\\s+|>\\s?)?");
  _ulRe = new RegExp("^(?:" + alt + ")\\s+(.*)$");
}
function markerRe(){ buildMarkerRe(); return _mkRe; }
function ulRe(){ buildMarkerRe(); return _ulRe; }
/* 깊이에 맞는 목록 기호 (공백 포함) */
function bulletMark(depth){
  const b = bulletList();
  return b[Math.max(0, Math.min(b.length - 1, depth))] + " ";
}
const isBulletMarker = mk => !!mk && ulRe().test(mk + "x");
/* 줄을 들여쓰기 / 표시 / 내용으로 쪼갠다 */
function splitLine(l){
  const m = markerRe().exec(l) || [l, "", ""];
  return { indent: m[1] || "", marker: m[2] || "", body: l.slice((m[0]||"").length) };
}
/* 같은 깊이에서 바로 위 번호 목록의 다음 번호 */
function nextNumber(v, start, indent){
  let p = start;
  while(p > 0){
    const lineEnd = p - 1;
    const lineStart = v.lastIndexOf("\n", lineEnd - 1) + 1;
    const prev = v.slice(lineStart, lineEnd);
    if(!prev.trim()) break;
    const sp = splitLine(prev);
    if(sp.indent.length < indent.length) break;
    if(sp.indent.length === indent.length){
      const m = /^(\d+)[.)]/.exec(sp.marker);
      if(m) return parseInt(m[1], 10) + 1;
      break;
    }
    p = lineStart;
  }
  return 1;
}
function mdLine(ta, prefix){
  const v = ta.value;
  const start = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  let end = v.indexOf("\n", ta.selectionEnd);
  if(end < 0) end = v.length;
  const lines = v.slice(start, end).split("\n");
  const isOl = prefix === "1. ";
  const isUl = prefix === "- ";
  const re = isOl ? /^\d+[.)]\s+/
    : isUl ? ulRe()
    : new RegExp("^" + reEsc(prefix));
  /* 글자가 없는 줄에서도 적용되어야 한다. 그래야 먼저 '# '를 넣고 이어서 쓸 수 있다. */
  const only = lines.length === 1;
  const mkTest = l => {
    const mk = splitLine(l).marker;
    return isUl ? isBulletMarker(mk) : re.test(mk);
  };
  const has = only ? mkTest(lines[0]) : lines.every(l => !l.trim() || mkTest(l));
  /* 한 줄만 바꿀 때는 위 목록 번호를 이어받고, 여러 줄이면 1부터 매긴다 */
  const base = isOl && only ? nextNumber(v, start, splitLine(lines[0]).indent) : 1;
  let n = base;
  const out = lines.map((l)=>{
    if(!l.trim() && !only) return l;
    const sp = splitLine(l);
    if(has) return sp.indent + sp.body;
    const mark = isOl ? (n++) + ". "
      : isUl ? bulletMark(Math.floor(sp.indent.replace(/\t/g, INDENT).length / 2))
      : prefix;
    return sp.indent + mark + sp.body;
  });
  const txt = out.join("\n");
  if(only && !lines[0].trim()){
    /* 빈 줄이었다면 바로 이어 쓸 수 있게 커서를 끝에 둔다 */
    editTA(ta, start, end, txt, start + txt.length);
  }else{
    editTA(ta, start, end, txt, start, start + txt.length);
  }
}
/* 줄 앞 공백 두 칸을 넣고 뺀다. 번호 목록은 깊이에 맞춰 다시 매긴다. */
function mdIndent(ta, dir){
  const v = ta.value;
  const start = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  let end = v.indexOf("\n", ta.selectionEnd);
  if(end < 0) end = v.length;
  const lines = v.slice(start, end).split("\n");
  const out = lines.map(l=>{
    if(!l.trim() && lines.length > 1) return l;
    const moved = dir > 0 ? INDENT + l : l.replace(/^(\t| {1,2})/, "");
    /* 목록이면 새 깊이의 기호로 바꿔 단계가 바로 보이게 한다 */
    const sp = splitLine(moved);
    if(isBulletMarker(sp.marker)){
      const depth = Math.floor(sp.indent.replace(/\t/g, INDENT).length / 2);
      return sp.indent + bulletMark(depth) + sp.body;
    }
    return moved;
  });
  const txt = out.join("\n");
  const delta = txt.length - (end - start);
  const cur = ta.selectionStart;
  if(lines.length === 1){
    const pos = Math.min(Math.max(start, cur + delta), start + txt.length);
    editTA(ta, start, end, txt, pos);
  }else{
    editTA(ta, start, end, txt, start, start + txt.length);
  }
  renumber(ta);
}
/* 번호 목록을 깊이별로 다시 매긴다.
   바뀐 줄만 고쳐서 커서와 자동완성이 흔들리지 않게 한다. */
function renumber(ta){
  const src = ta.value;
  const lines = src.split("\n");
  const starts = []; let p = 0;
  lines.forEach(l=>{ starts.push(p); p += l.length + 1; });

  const counters = {};
  let prevIndent = null;
  const out = lines.map(l=>{
    if(!l.trim()){ prevIndent = null; return l; }
    const sp = splitLine(l);
    const d = sp.indent.length;
    const m = /^(\d+)([.)])\s+/.exec(sp.marker);
    if(!m){
      if(!/^[-*+]\s+/.test(sp.marker)){ for(const k in counters) delete counters[k]; }
      prevIndent = d;
      return l;
    }
    if(prevIndent !== null && d > prevIndent) counters[d] = 0;
    if(counters[d] === undefined) counters[d] = 0;
    for(const k in counters){ if(+k > d) delete counters[k]; }
    counters[d]++;
    prevIndent = d;
    return sp.indent + counters[d] + m[2] + " " + sp.body;
  });

  /* 바뀐 줄만 추려 뒤에서부터 고친다 (앞 줄 위치가 밀리지 않도록) */
  const changed = [];
  for(let i = 0; i < lines.length; i++){
    if(out[i] !== lines[i]) changed.push(i);
  }
  if(!changed.length) return;

  const a = ta.selectionStart, b = ta.selectionEnd;
  /* 커서가 속한 줄과 그 줄 안에서의 위치를 기억해 둔다 */
  const locate = pos => {
    let i = 0;
    while(i + 1 < lines.length && starts[i + 1] <= pos) i++;
    return { line:i, off: pos - starts[i] };
  };
  const la = locate(a), lb = locate(b);

  for(let k = changed.length - 1; k >= 0; k--){
    const i = changed[k];
    editTA(ta, starts[i], starts[i] + lines[i].length, out[i]);
  }

  /* 줄 안 위치를 마커 길이 변화만큼만 보정한다 */
  const nStarts = []; let q = 0;
  out.forEach(l=>{ nStarts.push(q); q += l.length + 1; });
  const remap = loc => {
    const i = loc.line;
    const oldSp = splitLine(lines[i]), newSp = splitLine(out[i]);
    const oldLen = oldSp.indent.length + oldSp.marker.length;
    const newLen = newSp.indent.length + newSp.marker.length;
    const off = loc.off <= oldLen ? newLen : loc.off + (newLen - oldLen);
    return nStarts[i] + Math.max(0, Math.min(off, out[i].length));
  };
  ta.selectionStart = remap(la);
  ta.selectionEnd = Math.max(ta.selectionStart, remap(lb));
}
/* 제목 단계를 한 버튼으로 돌린다: 없음 → # → ## → ### → 없음 */
function mdHeading(ta){
  const v = ta.value;
  const start = v.lastIndexOf("\n", ta.selectionStart - 1) + 1;
  let end = v.indexOf("\n", ta.selectionEnd);
  if(end < 0) end = v.length;
  const line = v.slice(start, end);
  const sp = splitLine(line);
  const m = /^(#{1,3})\s+/.exec(sp.marker);
  const lvl = m ? m[1].length : 0;
  const next = lvl >= 3 ? 0 : lvl + 1;
  const mark = next ? "#".repeat(next) + " " : "";
  const body = m ? sp.body : (sp.marker ? sp.marker + sp.body : sp.body);
  const txt = sp.indent + mark + body;
  const oldLen = sp.indent.length + (m ? sp.marker.length : 0);
  const newLen = sp.indent.length + mark.length;
  const cur = ta.selectionStart;
  const off = cur - start;
  const pos = start + (off <= oldLen ? newLen : off + (newLen - oldLen));
  editTA(ta, start, end, txt, Math.min(Math.max(pos, start), start + txt.length));
  return next;
}
function mdInsert(ta, text){

  const ins = (a === 0 || v[a-1] === "\n" ? "" : "\n") + text;

}
function applyMdTool(key, ta){
  ta = ta || document.getElementById("md-src");
  const tool = MD_TOOLS.find(x=>x.k===key);
  if(!ta || !tool) return;
  if(tool.t === "wrap") mdWrap(ta, tool.v);
  else if(tool.t === "line") mdLine(ta, tool.v);
  else if(tool.t === "indent") mdIndent(ta, tool.v);
  else if(tool.t === "heading") mdHeading(ta);
  else mdInsert(ta, tool.v);
  ta.focus();
  ta.dispatchEvent(new Event("input", { bubbles:true }));
}

/* iOS는 주소창·키보드 때문에 100vh가 실제 보이는 높이보다 크다.
   visualViewport로 실제 영역을 재서 시트가 아래로 잘리지 않게 한다. */
function fitViewport(){
  const vv = window.visualViewport;
  if(!vv) return;
  const r = document.documentElement.style;
  r.setProperty("--vvh", Math.round(vv.height) + "px");
  r.setProperty("--vvt", Math.round(vv.offsetTop) + "px");
}
if(window.visualViewport){
  visualViewport.addEventListener("resize", fitViewport);
  visualViewport.addEventListener("scroll", fitViewport);
}
addEventListener("orientationchange", ()=>setTimeout(fitViewport, 200));
fitViewport();

const layer = document.getElementById("layer");
function closeLayer(){ layer.innerHTML = ""; }
function sheet(html, opt){
  opt = opt || {};
  fitViewport();
  layer.innerHTML = `<div class="scrim ${opt.center?"center":""}" data-act="scrim">
    <div class="sheet" role="dialog" aria-modal="true">
      ${opt.center?"":'<div class="grip"></div>'}${html}
    </div></div>`;
  const f = layer.querySelector("[data-autofocus]");
  if(f) setTimeout(()=>f.focus(), 60);
  const hex = layer.querySelector("#c-hex");
  if(hex) hex.addEventListener("input", ()=>applyDraftColor(hex.value));
}
function toast(msg){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>{ if(el.isConnected && !el.dataset.keep) el.remove(); }, 2000);
  return el;
}
/* 지운 것을 되돌릴 수 있게 잠시 들고 있는다 */
let undoSnap = null, undoTimer = null;
function toastUndo(msg, snapshot){
  undoSnap = snapshot;
  clearTimeout(undoTimer);
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const el = document.createElement("div");
  el.className = "toast undo";
  el.dataset.keep = "1";
  el.innerHTML = `<span>${esc(msg)}</span><button data-act="undo-del">되돌리기</button>`;
  document.body.appendChild(el);
  undoTimer = setTimeout(()=>{ el.remove(); undoSnap = null; }, 8000);
}

let draftColor = COLOR_PRESETS[0], draftTpl = null, draftSec = "";
function applyDraftColor(v){
  draftColor = normHex(v) || draftColor;
  layer.querySelectorAll(".sw[data-v]").forEach(s=>
    s.setAttribute("aria-pressed", s.dataset.v===draftColor));
  const custom = layer.querySelector(".sw.custom");
  if(custom){
    custom.style.background = draftColor;
    custom.setAttribute("aria-pressed", !COLOR_PRESETS.includes(draftColor));
  }
  const inp = layer.querySelector("#c-hex");

const isChildLine = l => /^[ \t\u00a0]+\S/.test(l) || /^[-•*\u2022]\s+/.test(l.trim());
const cleanLine = l => l.replace(/^[ \t\u00a0]*[-•*\u2022]?[ \t\u00a0]*/,"").trim();
function parseOutline(text){
  const raw = text.split(/\r?\n/).filter(l=>l.trim()!=="");
  const nested = raw.some(isChildLine);
  return raw.map(l=>({
    type: nested ? (isChildLine(l) ? "lesson" : "section") : "lesson",
    label: cleanLine(l)
  })).filter(x=>x.label).slice(0,400);
}
function bulkItems(){
  if(bulkMode==="num"){
    const s = parseInt(document.getElementById("b-start").value,10);
    const e = parseInt(document.getElementById("b-end").value,10);
    const pre = document.getElementById("b-prefix").value;
    const suf = document.getElementById("b-suffix").value;
    if(isNaN(s)||isNaN(e)) return [];
    const out = [];
    const step = s<=e ? 1 : -1;
    for(let i=s; step>0 ? i<=e : i>=e; i+=step){
      out.push({ type:"lesson", label:`${pre}${i}${suf}` });
      if(out.length>300) break;
    }
    return out;
  }
  return parseOutline(document.getElementById("b-list").value);
}
function bindBulkPreview(){
  const paint = ()=>{
    const items = bulkItems();
    const box = document.getElementById("b-prev");
    if(!box) return;
    if(!items.length){ box.innerHTML = "만들어질 항목이 없습니다."; return; }
    const secs = items.filter(x=>x.type==="section").length;
    const les = items.length - secs;
    const head = `<b>${secs?secs+"개 섹션 · ":""}${les}회차</b>`;
    const lines = items.slice(0,9).map(x=>
      x.type==="section" ? `<span class="ol-s">${esc(x.label)}</span>`
                         : `<span class="ol-l">${esc(x.label)}</span>`).join("");
    box.innerHTML = head + `<div class="outline-pv">${lines}${
      items.length>9?`<span class="ol-more">… 외 ${items.length-9}개</span>`:""}</div>`;
  };
  layer.querySelectorAll("#b-start,#b-end,#b-prefix,#b-suffix,#b-list")
    .forEach(el=>el.addEventListener("input", paint));

}

/* 이미 이스케이프된 문자열을 받는다는 전제 (원본 HTML은 들어올 수 없음) */
function mdInline(t){
  const codes = [];
  let out = t.replace(/`([^`]+)`/g, (m,p1)=>{ codes.push(p1); return "\u0001" + (codes.length-1) + "\u0001"; });
  /* 한 번만 돌리면 **==셋==** 처럼 세 겹으로 감싼 경우 바깥쪽이 남는다.
     안쪽이 태그로 바뀐 뒤 한 번 더 훑어 바깥쪽까지 처리한다. */
  const pass = x => x
    .replace(/==([^=\n]+)==/g, '<mark>$1</mark>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>')
    .replace(/~~([^~]+)~~/g, '<del>$1</del>');
  out = pass(pass(out));
  return out.replace(/\u0001(\d+)\u0001/g, (m,i)=>'<code>' + codes[+i] + '</code>');
}
/* 접어 둔 제목을 기억한다 (칸마다 따로) */
const foldClosed = Object.create(null);
function mdToHtml(src, opts){
  const br = !!(opts && opts.br);
  const foldKey = opts && opts.fold;   /* 값이 있으면 제목을 접을 수 있게 만든다 */
  const heads = [];                    /* 열려 있는 제목 단계 */
  let headNo = 0;
  const closeHeads = lvl => {
    while(heads.length && heads[heads.length - 1] >= lvl){
      out.push("</div></details>");
      heads.pop();
    }
  };
  const lines = String(src||"").replace(/\r\n?/g,"\n").split("\n");
  const out = []; let para = [];
  /* 들여쓰기 깊이만큼 목록을 겹쳐 연다 */
  const stack = [];   /* 열려 있는 목록들의 태그 */
  const closeTo = n => { while(stack.length > n) out.push("</" + stack.pop() + ">"); };
  const openList = (tag, depth) => {
    closeTo(depth + 1);
    if(stack.length === depth + 1 && stack[depth] !== tag){
      out.push("</" + stack.pop() + ">");
    }
    while(stack.length < depth + 1){
      out.push("<" + tag + ">");
      stack.push(tag);
    }
  };
  let list = null;
  const flushP = ()=>{
    if(!para.length) return;
    /* 노트는 줄바꿈을 눌러 쓴 그대로 살린다 */
    out.push("<p>" + (br ? para.map(mdInline).join("<br>") : mdInline(para.join(" "))) + "</p>");
    para = [];
  };
  const flushL = ()=>{ closeTo(0); list = null; };
  lines.forEach(raw=>{
    const t = raw.trim();
    if(!t){ flushP(); flushL(); return; }
    let m;
    if((m = /^(#{1,4})\s+(.*)$/.exec(t))){
      flushP(); flushL();
      const n = m[1].length;
      if(!foldKey){
        out.push("<h"+n+">"+mdInline(m[2])+"</h"+n+">"); return;
      }
      closeHeads(n);
      const fid = foldKey + ":" + (headNo++);
      const open = foldClosed[fid] ? "" : " open";
      out.push('<details class="fold" data-fid="' + esc(fid) + '"' + open + '>'
        + '<summary><h' + n + '>' + mdInline(m[2]) + '</h' + n + '></summary>'
        + '<div class="fold-body">');
      heads.push(n);
      return;
    }
    if(/^(-{3,}|\*{3,}|_{3,})$/.test(t)){ flushP(); flushL(); out.push("<hr>"); return; }
    if((m = /^&gt;\s?(.*)$/.exec(t))){ flushP(); flushL(); out.push("<blockquote>"+mdInline(m[1])+"</blockquote>"); return; }
    const ind = /^[ \t]*/.exec(raw)[0].replace(/\t/g, "  ").length;
    const depth = Math.min(Math.floor(ind / 2), 5);
    if((m = ulRe().exec(t))){
      flushP(); openList("ul", depth);
      /* 글자에 쓰인 기호를 그대로 쓴다. 설정을 바꿔도 예전 노트는 쓴 그대로 보인다. */
      const mk = t.slice(0, t.length - m[1].length).trim();
      out.push('<li style="--mk:' + esc(JSON.stringify(mk)) + '">' + mdInline(m[1]) + "</li>"); return;
    }
    if((m = /^\d+[.)]\s+(.*)$/.exec(t))){
      flushP(); openList("ol", depth);
      out.push("<li>"+mdInline(m[1])+"</li>"); return;
    }
    flushL(); para.push(t);
  });
  flushP(); flushL();
  if(foldKey) closeHeads(1);
  return out.join("\n");
}
function fillVars(tplText, vars){
  return esc(tplText).replace(/\{\{\s*([^{}]+?)\s*\}\}/g, (m,k)=>{
    const v = vars[k.trim()];
    return v === undefined ? m : esc(v);
  });
}
function mdBlock(tplText, vars, tocHTML){

    html = html.replace(/<p>\s*\{\{목차\}\}\s*<\/p>|\{\{목차\}\}/g, tocHTML);
  return `<div class="p-md">${html}</div>`;
}
