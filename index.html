/* 인쇄용 칸 상자 — 화면과 같은 라벨·테두리·높이 비율을 유지한다 */
function pField(label, rows, val){
  const v = (val||"").trim();
  const lines = Math.min(clampInt(rows,1,MAXROWS,4), 6);
  /* 한 페이지를 넘길 만한 칸은 쪼개질 수 있게 둔다.
     통째로 유지하려 들면 넘치는 부분이 잘려 사라진다. */
  const long = v.length > 300 || v.split("\n").length > 6;
  return `<div class="p-field${v?"":" empty"}${long?" long":""}" style="min-height:calc(${lines} * 1.62em)">
    <div class="lab">${esc(label)}</div>
    <div class="val">${v ? mdToHtml(esc(v), { br:true }) : ""}</div>
  </div>`;
}
/* 노트 '내용' 부분만. 머리말은 PDF 문서 서식(마크다운)이 담당한다. */
function noteFieldsHTML(c, l){
  const tpl = tplFor(c,l);
  const orphans = orphanKeys(c,l);
  if(S.settings.pdfStyle === "text"){
    const parts = fieldsOf(c,l).map(f=>{
      const v = (l[f.k]||"").trim();
      return v ? `<h3>${esc(f.label)}</h3><div class="val">${mdToHtml(esc(v),{ br:true })}</div>` : "";
    }).join("") + orphans.map(k=>
      `<h3>${esc(labelForKey(k))}</h3><div class="val">${mdToHtml(esc(l[k]),{ br:true })}</div>`).join("");
    return parts || `<p class="p-empty">작성된 노트가 없습니다.</p>`;
  }
  return renderBlocks(fieldsOf(c,l), colsOf(tpl),
      f=>pField(f.label, rowsOf(f), l[f.k]),
      { wrap:"p-cols", col:"p-col" })
    + orphans.map(k=>pField(labelForKey(k), 2, l[k])).join("");
}

function exportJSON(){
  const payload = { app:"lecture-notes", appVersion:APP_VERSION, exportedAt:nowISO(), data:S };
  const text = JSON.stringify(payload,null,2);
  let url, revoke = false;
  try{
    url = URL.createObjectURL(new Blob([text], { type:"application/json" }));
    revoke = true;
  }catch(err){
    /* Blob URL을 못 만드는 환경 대비 */
    url = "data:application/json;charset=utf-8," + encodeURIComponent(text);
  }
  const a = document.createElement("a");
  const d = new Date();
  a.href = url;
  a.download = `강의노트_백업_${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  if(revoke) setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
  toast("백업 파일을 내려받았습니다");
}
const fileInput = document.getElementById("fileInput");
fileInput.addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    let incoming;
    try{
      const parsed = JSON.parse(rd.result);
      incoming = parsed.data && parsed.data.courses ? parsed.data : parsed;
      if(!incoming || !Array.isArray(incoming.courses)) throw 0;
    }catch(err){
      sheet(`<h3>가져올 수 없습니다</h3><p class="desc">이 앱에서 내보낸 JSON 백업 파일인지 확인해 주세요.</p>
        <div class="btn-row"><button class="btn primary wide" data-act="close">확인</button></div>`,{center:true});
      fileInput.value = ""; return;
    }
    const n = incoming.courses.length;
    const ln = incoming.courses.reduce((a,c)=>a+(c.lessons?c.lessons.length:0),0);
    sheet(`<h3>가져오기 방식</h3>
      <p class="desc">파일에 강의 ${n}개, 회차 ${ln}개가 있습니다. 지금 이 브라우저에는 강의 ${S.courses.length}개가 있습니다.</p>
      <div class="btn-row" style="flex-direction:column">
        <button class="btn primary wide" data-act="do-import" data-mode="merge">합치기 — 같은 항목은 최신 내용으로</button>
        <button class="btn ghost wide" data-act="do-import" data-mode="replace">덮어쓰기 — 지금 내용을 모두 지우고 교체</button>
        <button class="btn ghost wide" data-act="close">취소</button>
      </div>`);
    pendingImport = incoming;
    fileInput.value = "";
  };
  rd.readAsText(f);
});
let pendingImport = null;
function applyImport(mode){
  const inc = pendingImport;
  if(!inc) return;
  if(mode==="replace"){
    S.courses = inc.courses;
    if(Array.isArray(inc.templates) && inc.templates.length) S.templates = inc.templates;
  }else{
    inc.courses.forEach(nc=>{
      const ex = S.courses.find(c=>c.id===nc.id);
      if(!ex){ S.courses.push(nc); return; }
      if((nc.updatedAt||"") > (ex.updatedAt||"")){
        ex.title = nc.title; ex.source = nc.source; ex.color = nc.color; ex.updatedAt = nc.updatedAt;
      }
      (nc.lessons||[]).forEach(nl=>{
        const el = ex.lessons.find(l=>l.id===nl.id);
        if(!el){ ex.lessons.push(nl); return; }
        if((nl.updatedAt||"") > (el.updatedAt||"")) Object.assign(el, nl);
      });
    });
  }
  if(Array.isArray(inc.templates)){
    inc.templates.forEach(nt=>{
      const ex = S.templates.find(x=>x.id===nt.id);
      if(!ex) S.templates.push(nt);
      else if((nt.updatedAt||"") > (ex.updatedAt||"")) Object.assign(ex, nt);
    });
  }
  S.courses.forEach(c=>{
    c.color = normHex(c.color) || normHex(LEGACY_COLORS[c.color]) || COLOR_PRESETS[0];
    c.lessons = (c.lessons||[]).map(l=>Object.assign(newLesson(l.label||"회차"), l));
  });
  pendingImport = null;
  migrate();
  commit(); closeLayer(); render();
  toast(mode==="replace" ? "데이터를 교체했습니다" : "데이터를 합쳤습니다");
}

/* ============================================================
   10. 업데이트 확인
   ============================================================ */
function cmpVer(a,b){
  const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number);
  for(let i=0;i<3;i++){
    const d = (x[i]||0) - (y[i]||0);
    if(d) return d>0 ? 1 : -1;
  }
  return 0;
}
function changelogSheet(from){
  const items = CHANGELOG.filter(e=>!from || cmpVer(e.v, from) > 0);
  const list = (items.length?items:CHANGELOG).map(e=>`
    <div style="margin-top:14px">
      <div style="font-size:13px;font-weight:700">v${e.v}
        <span style="color:var(--muted);font-weight:500"> · ${e.date}</span></div>
      <ul style="margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2);line-height:1.7">
        ${e.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>
    </div>`).join("");
  sheet(`<h3>${from?"업데이트되었습니다":"변경 내역"}</h3>
    <p class="desc">${from?`v${from} → v${APP_VERSION}`:`현재 v${APP_VERSION}`}</p>
    ${list}
    <div class="btn-row"><button class="btn primary wide" data-act="close">확인</button></div>`);
}
async function checkUpdate(manual){
  try{
    const res = await fetch("version.json?ts=" + Date.now(), { cache:"no-store" });
    if(!res.ok) throw 0;
    const info = await res.json();
    if(cmpVer(info.version, APP_VERSION) > 0){
      sheet(`<h3>새 버전이 있습니다</h3>
        <p class="desc">v${esc(info.version)}가 올라와 있습니다. 지금 화면은 v${APP_VERSION}입니다.
        새로고침하면 최신 버전으로 열립니다. 저장한 노트는 그대로 유지됩니다.</p>
        ${Array.isArray(info.notes)&&info.notes.length?`<ul style="margin:12px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2);line-height:1.7">
          ${info.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
        <div class="btn-row">
          <button class="btn ghost" style="flex:1;justify-content:center" data-act="close">나중에</button>
          <button class="btn primary" style="flex:1;justify-content:center" data-act="hard-reload">새로고침</button>
        </div>`);
      return;
    }
    if(manual) toast("최신 버전입니다 (v" + APP_VERSION + ")");
  }catch(e){
    if(manual) toast("버전 정보를 불러올 수 없습니다");
  }
}
function bootUpdateNotice(){
  const seen = S.settings.lastSeenVersion;
  if(seen && cmpVer(APP_VERSION, seen) > 0){
    changelogSheet(seen);
  }
  if(S.settings.lastSeenVersion !== APP_VERSION){
    S.settings.lastSeenVersion = APP_VERSION;
    commit();
  }
}

        <button data-act="note-tpl" data-cid="${c.id}" data-lid="${l.id}">${I.note} 이 노트의 템플릿 바꾸기</button>
        <button data-act="ren-lesson" data-cid="${c.id}" data-lid="${l.id}">${I.pen} 회차 이름 변경</button>
        <button data-act="pdf-note" data-cid="${c.id}" data-lid="${l.id}">${I.pdf} 이 노트 PDF</button>
        <button data-act="pdf-course" data-id="${c.id}">${I.pdf} 강의 전체 PDF</button>
        <hr>
        <button class="warn" data-act="del-lesson" data-cid="${c.id}" data-lid="${l.id}">${I.trash} 회차 삭제</button>
      </div>`);
      break;
    }

    /* 강의 */
    case "new-course": closeLayer(); courseSheet(null); break;
    case "edit-course": closeLayer(); courseSheet(c); break;
    case "pick-color": applyDraftColor(t.dataset.v); break;
    case "create-course": {
      const title = layer.querySelector("#c-title").value.trim();
      if(!title){ toast("강의 이름을 입력해 주세요"); layer.querySelector("#c-title").focus(); return; }
      const nc = { id:uid(), title, source:layer.querySelector("#c-src").value.trim(),
        color:draftColor, templateId:draftTpl || S.settings.defaultTemplateId,
        lessons:[], createdAt:nowISO(), updatedAt:nowISO() };
      S.courses.unshift(nc);
      commit(); closeLayer(); go("#/c/"+nc.id);
      setTimeout(()=>bulkSheet(nc.id), 260);
      break;
    }
    case "save-course": {
      const title = layer.querySelector("#c-title").value.trim();
      if(!title){ toast("강의 이름을 입력해 주세요"); return; }
      c.title = title;
      c.source = layer.querySelector("#c-src").value.trim();
      c.color = draftColor;
      c.templateId = draftTpl || c.templateId;
      c.updatedAt = nowISO();
      commit(); closeLayer(); render(); toast("저장했습니다");
      break;
    }
    case "del-course":
      closeLayer();
      confirmSheet("강의를 삭제할까요?",
        `${c.title} · 회차 ${lessonsOf(c).length}개와 노트가 함께 지워집니다. 되돌릴 수 없습니다.`,
        "삭제", ()=>{
          const snap = JSON.parse(JSON.stringify(S));
          S.courses = S.courses.filter(x=>x.id!==c.id);
          commit(); closeLayer(); go("#/");
          toastUndo("강의를 삭제했습니다", snap);
        }, true);
      break;

    /* 회차 */
    case "add-lesson": case "add-section": {
      const isSec = a==="add-section";
      const secs = c.lessons.filter(isSection);
      const hasHead = c.lessons.length && !isSection(c.lessons[0]);
      draftSec = t.dataset.sec !== undefined ? t.dataset.sec
        : (secs.length ? secs[secs.length-1].id : "");
      closeLayer();
      sheet(`<h3>${isSec?"섹션 추가":"회차 추가"}</h3>
        <p class="desc">${isSec
          ? "섹션은 제목 역할만 합니다. 노트는 없고, 아래에 오는 회차들을 묶습니다."
          : "노트를 쓰는 항목입니다. 1강, 오리엔테이션 등 이름을 그대로 씁니다."}</p>
        <div class="field"><div class="field-head"><label for="l-name">${isSec?"섹션 제목":"회차 이름"}</label></div>
          <input id="l-name" type="text" data-autofocus autocorrect="on" autocapitalize="sentences"
            placeholder="${isSec?"예: Welcome":"예: 3강 색 고르기"}" enterkeyhint="done"></div>
        ${!isSec && secs.length ? `
          <div class="field">
            <div class="field-head"><label>어느 섹션에</label>
              <span class="hint">그 섹션 맨 뒤에 들어갑니다</span></div>
            <div class="chips">
              ${hasHead?`<button class="chip sm" data-act="pick-sec" data-v=""
                aria-pressed="${draftSec===""}">섹션 없음 (맨 위)</button>`:""}
              ${secs.map(x=>`
                <button class="chip sm" data-act="pick-sec" data-v="${x.id}"
                  aria-pressed="${draftSec===x.id}">${esc(x.label)}</button>`).join("")}
            </div>
          </div>` : ""}
        <div class="btn-row"><button class="btn primary wide" data-act="add-lesson-ok"
          data-id="${id}" data-v="${isSec?"section":"lesson"}">추가</button></div>`);
      break;
    }
    case "pick-sec":
      draftSec = t.dataset.v;
      layer.querySelectorAll("[data-act='pick-sec']").forEach(b=>
        b.setAttribute("aria-pressed", b.dataset.v===draftSec));
      break;
    case "add-lesson-ok": {
      const v = layer.querySelector("#l-name").value.trim();
      const isSec = t.dataset.v==="section";
      if(!v){ toast(isSec?"섹션 제목을 입력해 주세요":"회차 이름을 입력해 주세요"); return; }
      if(isSec){
        c.lessons.push(newSection(v));
      }else{
        c.lessons.splice(insertPos(c, draftSec), 0, newLesson(v));
      }
      c.updatedAt = nowISO();
      commit(); closeLayer(); render();
      const sec = draftSec ? findLesson(c, draftSec) : null;
      toast(isSec ? "섹션을 추가했습니다"
        : (sec ? `${sec.label}에 추가했습니다` : "추가했습니다"));
      break;
    }
    case "bulk-lesson": closeLayer(); bulkSheet(id); break;
    case "bulk-mode": bulkMode = t.dataset.v; bulkSheet(document.querySelector("[data-act='bulk-create']").dataset.id); break;
    case "bulk-create": {
      const items = bulkItems();
      if(!items.length){ toast("만들 항목이 없습니다"); return; }
      items.forEach(x=>c.lessons.push(
        x.type==="section" ? newSection(x.label) : newLesson(x.label)));
      c.updatedAt = nowISO();
      const les = items.filter(x=>x.type==="lesson").length;
      const secs = items.length - les;
      commit(); closeLayer(); render();
      toast((secs?secs+"개 섹션, ":"") + les + "개 회차를 만들었습니다");
      break;
    }
    case "ren-lesson": {
      const l = findLesson(c, lid);
      closeLayer();
      sheet(`<h3>회차 이름 변경</h3>
        <div class="field"><div class="field-head"><label for="l-name">회차 이름</label></div>
          <input id="l-name" type="text" data-autofocus autocorrect="on" autocapitalize="sentences" value="${esc(l.label)}" enterkeyhint="done"></div>
        <div class="btn-row"><button class="btn primary wide" data-act="ren-ok" data-cid="${c.id}" data-lid="${l.id}">저장</button></div>`);
      break;
    }
    case "ren-ok": {
      const l = findLesson(c, lid);
      const v = layer.querySelector("#l-name").value.trim();
      if(!v){ toast("이름을 입력해 주세요"); return; }
      l.label = v; l.updatedAt = nowISO(); c.updatedAt = l.updatedAt;
      commit(); closeLayer(); render(); toast("변경했습니다");
      break;
    }
    case "del-lesson": {
      const l = findLesson(c, lid);
      closeLayer();
      confirmSheet(isSection(l)?"섹션을 삭제할까요?":"회차를 삭제할까요?",
        isSection(l)
          ? `${l.label} 제목만 지워지고, 아래에 있던 회차와 노트는 그대로 남습니다.`
          : `${l.label}에 적은 노트가 함께 지워집니다.`, "삭제", ()=>{
        const snap = JSON.parse(JSON.stringify(S));
        c.lessons = c.lessons.filter(x=>x.id!==l.id);
        c.updatedAt = nowISO();
        commit(); closeLayer();
        if(route().name==="note") go("#/c/"+c.id); else render();
        toastUndo(isSection(l) ? "섹션을 삭제했습니다" : "회차를 삭제했습니다", snap);
      }, true);
      break;
    }
    case "mv-up": case "mv-down": {
      const i = c.lessons.findIndex(x=>x.id===lid);
      const j = a==="mv-up" ? i-1 : i+1;
      if(j<0 || j>=c.lessons.length) return;
      const tmp = c.lessons[i]; c.lessons[i] = c.lessons[j]; c.lessons[j] = tmp;
      c.updatedAt = nowISO();
      commit(); render();
      break;
    }
    case "toggle-order": editOrder = !editOrder; render(); break;
    case "field-view": {
      /* 제목을 접으려고 누른 것이면 편집으로 바꾸지 않는다 */
      if(e.target.closest && e.target.closest("summary")) return;
      if(dirty) commit();
      const key = lid + "|" + t.dataset.k;
      fieldView[key] = !fieldView[key];
      render();
      break;
    }
    case "note-view-all": {
      if(dirty) commit();
      const l = findLesson(c, lid);
      const on = t.dataset.v === "1";
      fieldsOf(c,l).forEach(f=>{ fieldView[fvKey(l,f.k)] = on; });
      closeLayer(); render();
      break;
    }
    case "set-status": {
      const l = findLesson(c, lid);
      l.status = t.dataset.v;
      l.updatedAt = nowISO(); c.updatedAt = l.updatedAt;
      commit();
      view.querySelectorAll("[data-act='set-status']").forEach(b=>
        b.setAttribute("aria-pressed", b.dataset.v===l.status));
      break;
    }
    case "save-now": commit(); toast("저장했습니다 · " + fmtFull(S.settings.savedAt)); break;

    /* 데이터 */
    case "pdf-style":
      S.settings.pdfStyle = t.dataset.v==="text" ? "text" : "template";
      commit(); render();
      toast(S.settings.pdfStyle==="text" ? "내용만 내보냅니다" : "템플릿 그대로 내보냅니다");
      break;
    case "export-json": closeLayer(); exportJSON(); break;
    case "import-json": closeLayer(); fileInput.click(); break;
    case "do-import": applyImport(t.dataset.mode); break;
    case "reset-all":
      confirmSheet("모든 데이터를 삭제할까요?",
        "강의와 노트가 전부 지워집니다. 되돌릴 수 없습니다. 먼저 백업을 내보내는 것을 권합니다.",
        "전체 삭제", ()=>{
          const snap = JSON.parse(JSON.stringify(S));
          S = blank();
          migrate();
          S.settings.lastSeenVersion = APP_VERSION;
          commit(); closeLayer(); go("#/"); render();
          toastUndo("모두 삭제했습니다", snap);
        }, true);
      break;
    case "confirm-ok": if(pendingOk){ const f = pendingOk; pendingOk = null; f(); } break;
    case "undo-del": {
      if(!undoSnap) return;
      S = undoSnap; undoSnap = null;
      clearTimeout(undoTimer);
      document.querySelectorAll(".toast").forEach(x=>x.remove());
      migrate(); commit(); render(); toast("되돌렸습니다");
      break;
    }
    case "keep-mine": {
      const el = document.getElementById("saveAlert"); if(el) el.remove();
      commit(); toast("여기 내용을 저장했습니다");
      break;
    }
    case "keep-theirs": {
      const el = document.getElementById("saveAlert"); if(el) el.remove();
      const raw = Store.read();
      if(raw && raw.courses){ S = raw; dirty = false; migrate(); render(); toast("다른 탭 내용을 열었습니다"); }
      break;
    }

    /* PDF */
    case "pdf-note": closeLayer(); pdfNote(c, findLesson(c, lid)); break;
    case "pdf-course": closeLayer(); pdfCourse(c); break;
    case "pdf-all":
      closeLayer();
      if(!S.courses.length){ toast("내보낼 강의가 없습니다"); return; }
      pdfAll();
      break;

    /* 업데이트 */
    case "check-update": checkUpdate(true); break;
    case "show-changelog": changelogSheet(null); break;
    case "hard-reload":
      if(window.caches && caches.keys) caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
      location.reload();
      break;
  }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") closeLayer();
  if(e.key==="Enter" && e.target.matches("#l-name")){
    const btn = layer.querySelector("[data-act='add-lesson-ok'],[data-act='ren-ok']");
    if(btn) btn.click();
  }
  if((e.metaKey||e.ctrlKey) && e.key==="s"){ e.preventDefault(); commit(); toast("저장했습니다"); }
});

/* ============================================================
   12. 시작
   ============================================================ */
applyBullets();
render();
if(restoredFromBackup){
  setTimeout(()=>toast("저장본이 손상되어 직전 저장 내용으로 되살렸습니다"), 400);
}
bootUpdateNotice();
checkUpdate(false);
setInterval(()=>checkUpdate(false), 1000*60*30);
</script>
</body>
</html>
